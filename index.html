<!DOCTYPE html>

    /* 顶部青铜状态栏 */

      justify-content: space-between;
      padding: 0 24px;
      box-shadow: 0 -8px 30px rgba(0,0,0,0.9);
    }
    .brand-title {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 3px;
      background: linear-gradient(180deg, #fff8e1 0%, #d4af37 65%, #8c6618 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.9));
    }
    .hud-controls {
      display: flex;
      gap: 14px;
      align-items: center;
    }
    .stat-pill {
      background: linear-gradient(180deg, #080c0f 0%, #141e24 100%);
      border: 1.5px solid #574115;
      border-radius: 8px;
      padding: 5px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.9);

    .stat-label { font-size: 13px; color: #90a4ae; }
    .stat-num { font-size: 18px; font-weight: 800; color: var(--gold-light); font-family: "Segoe UI", sans-serif; }

    .action-btn {
      background: linear-gradient(180deg, #263845 0%, #121c24 100%);
      color: var(--gold-light);
      border: 1.5px solid var(--gold);
      padding: 7px 14px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .action-btn:hover { filter: brightness(1.2); transform: translateY(-1px); }
    .overload-btn {
      background: linear-gradient(180deg, #d32f2f 0%, #7f0000 100%);
      box-shadow: 0 0 15px rgba(211, 47, 47, 0.5);
    }
    .overload-btn:disabled { filter: grayscale(1); opacity: 0.4; cursor: not-allowed; transform: none; }

    /* 游戏主画布容器 */

    #tooltip {

      pointer-events: none;
      background: rgba(8, 12, 16, 0.96);
      border: 1.5px solid var(--gold);
      border-radius: 6px;

      font-size: 12px;
      color: #e0d8c8;
      box-shadow: 0 8px 24px rgba(0,0,0,0.9);
      display: none;
      z-index: 60;

    /* 底部纯原画立绘卡槽 */

<script>
/**
 * 《山海机关录：墨守》纯正原画立绘驱动引擎 v7.0
 * 核心特性：
 * 1. 彻底摒弃简笔画！100% 加载 assets/*.jpg 高精厚涂原画，卡槽与棋盘实体完全一致。
 * 2. 离屏像素级智能去背与边缘羽化算法 (Smart Matting Shader)：自动消除方形 JPG 生硬背景边角，合成 2.5D 浮雕棋子。
 * 3. 内置【贴图热替换工坊】：支持随时点击上传新生成的怪物/机关原画并实时抠图生效。
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const tooltipEl = document.getElementById('tooltip');

const ROWS = 5, COLS = 9;
const CELL_W = 96, CELL_H = 94;
const BOARD_X = 142, BOARD_Y = 44;

// 绑定 assets 目录下的全部原画路径（含已有 6 张原画 + 预留怪物原画路径）
const DEFAULT_ASSET_PATHS = {
  bg: 'assets/background.jpg?v=2',
  lion: 'assets/guardian_lion.jpg?v=2',
  furnace: 'assets/furnace.jpg?v=2',
  crossbow: 'assets/crossbow.jpg?v=2',
  landmine: 'assets/landmine.jpg?v=2',
  frost_mage: 'assets/frost_mage.jpg?v=2',
  fire_crow: 'assets/fire_crow.jpg?v=2',
  shield: 'assets/shield.jpg?v=2',
  taotie: 'assets/taotie.jpg?v=2',
  soldier: 'assets/soldier.jpg?v=2',
  rattan: 'assets/rattan.jpg?v=2',
  ape: 'assets/ape.jpg?v=2',
  hammer: 'assets/hammer.jpg?v=2',
  boss_head: 'assets/boss_xiangliu.jpg?v=2'
};

// 单位与怪物元数据

  { id: 'landmine', name: '震天埋雷', role: '伏火·爆破', cost: 25, cd: 10000, hp: 260, desc: '埋入地砖旋紧发条，激活后对踩中魇魔造成1500范围轰炸。' },
  { id: 'taotie', name: '吞天饕餮', role: '吞噬·炼化', cost: 150, cd: 8500, hp: 480, desc: '青铜凶兽重器，一口吞下前方单体魇魔，炼化后吐出25灵气。' },
  { id: 'frost_mage', name: '寒霜方士', role: '减速·冰封', cost: 175, cd: 5500, hp: 320, desc: '发射玄冰灵符减速敌人40%，概率直接触发玄冰封印。' },
  { id: 'fire_crow', name: '神火飞鸦', role: '奇术·全行', cost: 150, cd: 15000, hp: 9999, desc: '召唤赤金神火飞鸦席卷整行，造成1200贯穿烈焰伤害。' }
];

const MONSTER_CATALOG = [

  { id: 'rattan', name: '南疆藤甲卫', hp: 520, spd: 0.38, radius: 36, tint: '#8bc34a' },

];

  { id: 'lava_shield', tag: '天工改造', title: '【熔岩玄武】', desc: '玄武重盾展开赤焰护罩，每秒灼烧前方魇魔60点生命且反伤翻倍！' },

  { id: 'fast_taotie', tag: '天工改造', title: '【暴食吞天兽】', desc: '吞天饕餮炼化时间减半，消化期获60%减伤且吐出50巨额灵气！' },
  { id: 'mine_shrapnel', tag: '墨家奇术', title: '【草木皆兵】', desc: '鲁班拆解钳返还提至75%，且拆解瞬间在原地引发800伤害爆破！' }

// ==============================================================
// 一、 离屏像素级智能抠图与 2.5D 厚涂纹理合成管线 (SpriteEngine)
// ==============================================================
const RAW_IMAGES = {};
const MATTED_SPRITES = {}; // 抠除背景并羽化后的高清透明底离屏 Canvas

/**
 * 将带方形背景的 JPG 原画，通过四角背景色采样 + 距离场羽化，处理为柔和透明边缘的 2.5D 立体立绘贴图
 */
function createMattedSprite(img) {
  const size = 160;
  const off = document.createElement('canvas');
  off.width = size;
  off.height = size;
  const octx = off.getContext('2d');

  octx.drawImage(img, 0, 0, size, size);
  try {
    const imgData = octx.getImageData(0, 0, size, size);
    const data = imgData.data;

    // 采样四角背景基准色
    const r0 = data[0], g0 = data[1], b0 = data[2];
    const center = size / 2;
    const maxR = size * 0.47;

    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        const idx = (y * size + x) * 4;
        const r = data[idx], g = data[idx + 1], b = data[idx + 2];

        // 1. 径向柔和八角/椭圆羽化遮罩（消除方形 JPG 四个死角）
        const dx = x - center, dy = y - center;
        const dist = Math.hypot(dx, dy);
        let radialAlpha = 1;
        if (dist > maxR) {
          radialAlpha = 0;
        } else if (dist > maxR * 0.78) {
          radialAlpha = (maxR - dist) / (maxR * 0.22);
        }

        // 2. 背景色相似度智能抠除（越靠近外缘且颜色越接近四角背景色，越透明）
        const colorDiff = Math.hypot(r - r0, g - g0, b - b0);
        let bgKeyAlpha = 1;
        if (dist > maxR * 0.52 && colorDiff < 48) {
          bgKeyAlpha = Math.max(0, (colorDiff - 12) / 36);
        }

        data[idx + 3] = Math.floor(255 * radialAlpha * bgKeyAlpha);
      }
    }
    octx.putImageData(imgData, 0, 0);
  } catch (e) {
    // 若本地 file:// 协议触发跨域像素读取保护，则使用柔和径向蒙版合成
    octx.globalCompositeOperation = 'destination-in';
    const mask = octx.createRadialGradient(size / 2, size / 2, size * 0.32, size / 2, size / 2, size * 0.48);
    mask.addColorStop(0, 'rgba(0,0,0,1)');
    mask.addColorStop(0.82, 'rgba(0,0,0,0.92)');
    mask.addColorStop(1, 'rgba(0,0,0,0)');
    octx.fillStyle = mask;
    octx.fillRect(0, 0, size, size);
  }
  return off;
}

/**
 * 为尚未放入 JPG 文件的单位，利用现有原画纹理与多层光影体素，合成厚涂质感的预渲染贴图（杜绝简笔画线条）
 */
function generatePaintedFallbackSprite(key) {
  const size = 160;
  const off = document.createElement('canvas');
  off.width = size;
  off.height = size;
  const c = off.getContext('2d');
  c.translate(size / 2, size / 2);

  // 利用现有原画作为青铜/岩石真实材质纹理底图
  const baseTex = RAW_IMAGES.lion?.complete && RAW_IMAGES.lion.naturalWidth > 0
    ? RAW_IMAGES.lion
    : (RAW_IMAGES.furnace?.complete ? RAW_IMAGES.furnace : null);

  const presets = {
    shield: { hue: 175, sat: '80%', scaleX: 0.92, scaleY: 1.05, glow: '#00e5ff', crest: '玄武壁垒' },
    taotie: { hue: 285, sat: '130%', scaleX: 1.05, scaleY: 1.0, glow: '#e040fb', crest: '吞天饕餮' },
    soldier: { hue: 15, sat: '90%', scaleX: 0.85, scaleY: 1.08, glow: '#ff5252', crest: '秦墓宿卫' },
    rattan: { hue: 85, sat: '140%', scaleX: 0.95, scaleY: 1.05, glow: '#76ff03', crest: '南疆藤卫' },
    ape: { hue: 310, sat: '160%', scaleX: 0.88, scaleY: 0.95, glow: '#ea80fc', crest: '赤发山魈' },
    hammer: { hue: 42, sat: '150%', scaleX: 1.12, scaleY: 1.12, glow: '#ffd54f', crest: '镇狱金人' },
    boss_head: { hue: 150, sat: '180%', scaleX: 1.18, scaleY: 1.15, glow: '#00e676', crest: '九首·相柳' }
  }[key] || { hue: 0, sat: '100%', scaleX: 1, scaleY: 1, glow: '#d4af37', crest: '' };

  if (baseTex) {
    c.save();
    c.scale(presets.scaleX, presets.scaleY);
    c.beginPath();
    c.arc(0, 0, 66, 0, Math.PI * 2);
    c.clip();
    c.filter = `hue-rotate(${presets.hue}deg) saturate(${presets.sat}) contrast(125%)`;
    c.drawImage(baseTex, -72, -72, 144, 144);
    c.restore();

    // 边缘暗角立体厚涂融合
    const vig = c.createRadialGradient(0, 0, 28, 0, 0, 68);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(0.75, 'rgba(8,12,16,0.45)');
    vig.addColorStop(1, 'rgba(8,12,16,0.95)');
    c.fillStyle = vig;
    c.beginPath();
    c.arc(0, 0, 68, 0, Math.PI * 2);
    c.fill();
  }

  // 外圈浮雕暗金护环与底部铭牌
  c.strokeStyle = presets.glow;
  c.lineWidth = 3;
  c.beginPath();
  c.arc(0, 0, 64, 0, Math.PI * 2);
  c.stroke();

  c.fillStyle = 'rgba(6, 10, 14, 0.88)';
  c.strokeStyle = '#d4af37';
  c.lineWidth = 1.5;
  c.beginPath();
  c.roundRect(-42, 38, 84, 22, 6);
  c.fill();
  c.stroke();

  c.fillStyle = '#ffecb3';
  c.font = 'bold 13px "STKaiti", "PingFang SC", serif';
  c.textAlign = 'center';
  c.fillText(presets.crest, 0, 53);

  return off;
}

// 加载所有原画贴图与本地自定义贴图
function loadAllAssets(callback) {
  const savedCustom = JSON.parse(localStorage.getItem('MOSHOU_CUSTOM_SPRITES') || '{}');
  const keys = Object.keys(DEFAULT_ASSET_PATHS);
  let loadedCount = 0;

  keys.forEach(k => {
    const img = new Image();
    img.onload = () => {
      RAW_IMAGES[k] = img;
      if (k !== 'bg') MATTED_SPRITES[k] = createMattedSprite(img);
      checkDone();
    };
    img.onerror = () => {
      checkDone();
    };
    img.src = savedCustom[k] || DEFAULT_ASSET_PATHS[k];
  });

  function checkDone() {
    loadedCount++;
    if (loadedCount >= keys.length) {
      // 为尚未提供独立 JPG 的单位生成厚涂合成贴图
      keys.forEach(k => {
        if (k !== 'bg' && !MATTED_SPRITES[k]) {
          MATTED_SPRITES[k] = generatePaintedFallbackSprite(k);
        }
      });
      if (callback) callback();
    }
  }
}

// 将处理好的原画立绘渲染为 2.5D 立体棋子（带底座光环、受击闪白、呼吸缩放与方向翻转）
function drawPaintedStandee(ctx, key, x, y, size, opts = {}) {
  const {
    scaleX = 1, scaleY = 1,
    hitFlash = false,
    chilled = false,
    glowColor = '#d4af37',
    flipX = false
  } = opts;

  ctx.save();
  ctx.translate(x, y);

  // 1. 地面真实立体椭圆软阴影
  ctx.fillStyle = 'rgba(0, 0, 0, 0.68)';
  ctx.beginPath();
  ctx.ellipse(0, size * 0.36, size * 0.46, size * 0.22, 0, 0, Math.PI * 2);
  ctx.fill();

  // 2. 底部 2.5D 青铜浮雕法阵托盘
  const pedG = ctx.createLinearGradient(-size * 0.4, size * 0.2, size * 0.4, size * 0.4);
  pedG.addColorStop(0, '#37474f');
  pedG.addColorStop(0.5, '#1a252c');
  pedG.addColorStop(1, '#090d10');
  ctx.fillStyle = pedG;
  ctx.strokeStyle = glowColor;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(0, size * 0.28, size * 0.42, size * 0.18, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // 3. 绘制抠图羽化后的原画立绘本体
  ctx.scale(flipX ? -scaleX : scaleX, scaleY);
  if (hitFlash) {
    ctx.filter = 'brightness(250%) contrast(150%)';
  } else if (chilled) {
    ctx.filter = 'hue-rotate(170deg) saturate(160%)';
  }

  const sprite = MATTED_SPRITES[key];
  if (sprite) {
    ctx.drawImage(sprite, -size / 2, -size / 2 - 4, size, size);
  }

  ctx.restore();
}

let editingSpriteKey = null;

function openSpriteStudio() {
  state.paused = true;
  const list = document.getElementById('studio-list');
  list.innerHTML = '';
  const allItems = [
    { id: 'lion', name: '左侧·镇门石狮' },
    ...UNIT_CATALOG.map(u => ({ id: u.id, name: `机关·${u.name}` })),
    ...MONSTER_CATALOG.map(m => ({ id: m.id, name: `魇魔·${m.name}` }))
  ];

  allItems.forEach(item => {
    const slot = document.createElement('div');
    slot.className = 'studio-slot';
    const src = MATTED_SPRITES[item.id] ? MATTED_SPRITES[item.id].toDataURL() : '';
    slot.innerHTML = `
      <img src="${src}" />
      <div style="font-size:12px;font-weight:bold;color:var(--gold-light);">${item.name}</div>
      <div style="font-size:10px;color:#80cbc4;margin-top:2px;">点击上传替换原画</div>
    `;
    slot.onclick = () => {
      editingSpriteKey = item.id;
      document.getElementById('sprite-file-input').click();
    };
    list.appendChild(slot);
  });

  document.getElementById('studio-modal').style.display = 'flex';
}

function closeSpriteStudio() {
  document.getElementById('studio-modal').style.display = 'none';
  state.paused = false;
}

function resetCustomSprites() {
  localStorage.removeItem('MOSHOU_CUSTOM_SPRITES');
  location.reload();
}

document.getElementById('sprite-file-input').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file || !editingSpriteKey) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const base64 = ev.target.result;
    const saved = JSON.parse(localStorage.getItem('MOSHOU_CUSTOM_SPRITES') || '{}');
    saved[editingSpriteKey] = base64;
    localStorage.setItem('MOSHOU_CUSTOM_SPRITES', JSON.stringify(saved));

    const img = new Image();
    img.onload = () => {
      RAW_IMAGES[editingSpriteKey] = img;
      MATTED_SPRITES[editingSpriteKey] = createMattedSprite(img);
      initCardsUI();
      openSpriteStudio();
    };
    img.src = base64;
  };
  reader.readAsDataURL(file);
});

function showTooltip(e, html) {
  tooltipEl.innerHTML = html;
  tooltipEl.style.display = 'block';
  const rect = document.getElementById('game-wrapper').getBoundingClientRect();
  tooltipEl.style.left = `${Math.min(780, Math.max(12, e.clientX - rect.left + 16))}px`;
  tooltipEl.style.top = `${Math.max(12, e.clientY - rect.top - 55)}px`;
}
function hideTooltip() { tooltipEl.style.display = 'none'; }

function selectCard(unit) {
  if (state.paused) return;
  if (state.qi < unit.cost || state.cardCooldowns[unit.id] > 0) return;
  state.shovelMode = false;
  document.getElementById('shovel-btn').classList.remove('active');
  state.selectedCard = (state.selectedCard && state.selectedCard.id === unit.id) ? null : unit;
  updateHUD();
}

function toggleShovel() {
  state.selectedCard = null;
  state.shovelMode = !state.shovelMode;
  document.getElementById('shovel-btn').classList.toggle('active', state.shovelMode);
  updateHUD();
}

function triggerGlobalOverload() {
  if (state.energy < 50 || state.overloadTimer > 0) return;
  state.energy -= 50;
  state.overloadTimer = 420;
  state.screenShake = 12;
  spawnFloatingText(BOARD_X + 400, BOARD_Y + 220, '⚡ 矩子令：全军机巧过载！', '#ffd54f', 26);
  updateHUD();
}

function updateHUD() {
  document.getElementById('qi-display').innerText = Math.floor(state.qi);
  document.getElementById('wave-display').innerText = state.bossSpawned ? 'BOSS · 相柳' : `${state.wave} / ${state.maxWave}`;
  document.getElementById('energy-display').innerText = `${Math.floor(state.energy)}%`;
  document.getElementById('overload-btn').disabled = state.energy < 50 || state.overloadTimer > 0;
  document.getElementById('shovel-rate').innerText = state.activeBuffs.has('mine_shrapnel') ? '返75%+爆破' : '回收40%灵气';

  UNIT_CATALOG.forEach(u => {
    const el = document.getElementById(`card-${u.id}`);
    const cdEl = document.getElementById(`cd-${u.id}`);
    if (!el || !cdEl) return;
    const canAfford = state.qi >= u.cost && state.cardCooldowns[u.id] <= 0;
    el.classList.toggle('disabled', !canAfford);
    el.classList.toggle('selected', state.selectedCard && state.selectedCard.id === u.id);
    const ratio = Math.max(0, state.cardCooldowns[u.id] / u.cd) * 100;
    cdEl.style.height = `${ratio}%`;
  });
}

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  if (mx >= 16 && mx <= BOARD_X - 8 && my >= BOARD_Y && my <= BOARD_Y + ROWS * CELL_H) {
    showTooltip(e, `<b style="color:#ffecb3">【底线防线 · 镇门石狮】</b><br>直接加载 <code>assets/guardian_lion.jpg</code> 原画。当任何山海魇魔突破防线抵达最左侧时，石狮将喷吐烈焰冲锋，秒杀本行全部敌人！`);
    state.hoverCell = { r: -1, c: -1 };
    return;
  } else {
    hideTooltip();
  }

  const c = Math.floor((mx - BOARD_X) / CELL_W);
  const r = Math.floor((my - BOARD_Y) / CELL_H);
  state.hoverCell = (r >= 0 && r < ROWS && c >= 0 && c < COLS) ? { r, c } : { r: -1, c: -1 };
});

canvas.addEventListener('click', e => {
  if (state.paused) return;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  for (let i = state.gears.length - 1; i >= 0; i--) {
    const g = state.gears[i];
    if (Math.hypot(mx - g.x, my - g.y) < 32) {
      state.qi += g.val;
      spawnFloatingText(g.x, g.y, `+${g.val} 灵气`, '#ffecb3', 17);
      state.gears.splice(i, 1);
      updateHUD();
      return;
    }
  }

  const { r, c } = state.hoverCell;
  if (r < 0 || c < 0) return;

  const existingIdx = state.towers.findIndex(t => t.r === r && t.c === c);

  if (state.shovelMode) {
    if (existingIdx !== -1) {
      const removed = state.towers[existingIdx];
      const rate = state.activeBuffs.has('mine_shrapnel') ? 0.75 : 0.4;
      const refund = Math.floor(removed.cost * rate);
      state.qi += refund;
      spawnFloatingText(removed.x, removed.y, `回收 +${refund}`, '#00e5ff', 16);
      if (state.activeBuffs.has('mine_shrapnel')) {
        createExplosion(removed.x, removed.y, 130, 800);
      }
      state.towers.splice(existingIdx, 1);
      state.shovelMode = false;
      document.getElementById('shovel-btn').classList.remove('active');
      updateHUD();
    }
    return;
  }

  if (state.selectedCard && existingIdx === -1) {
    const u = state.selectedCard;
    const elem = state.elementalTiles[`${r}_${c}`];
    state.qi -= u.cost;
    state.cardCooldowns[u.id] = elem === 'water' ? u.cd * 0.7 : u.cd;

    const x = BOARD_X + c * CELL_W + CELL_W / 2;
    const y = BOARD_Y + r * CELL_H + CELL_H / 2;

    if (u.id === 'fire_crow') {
      spawnFireCrowRow(r, y);
    } else {
      state.towers.push({
        id: u.id, name: u.name, r, c, x, y,
        hp: u.hp, maxHp: u.hp, cost: u.cost,
        timer: 0, shotCount: 0,
        armed: u.id !== 'landmine', armTimer: 0,
        digesting: false, digestTimer: 0,
        scaleX: 1.32, scaleY: 0.68, hitFlash: 0
      });
    }

    for (let i = 0; i < 12; i++) {
      state.particles.push({
        x, y: y + 16,
        vx: (Math.random() - 0.5) * 5, vy: (Math.random() - 1) * 3.5,
        size: 3 + Math.random() * 3, color: '#ffd54f', life: 22
      });
    }
    state.selectedCard = null;
    updateHUD();
  }
});

function spawnFireCrowRow(r, y) {
  state.screenShake = 8;
  spawnFloatingText(BOARD_X + 260, y - 12, '🔥 神火飞鸦 · 焚尽八荒！', '#ff6d00', 21);
  state.bullets.push({

  });
}

function createExplosion(x, y, radius, dmg) {
  state.screenShake = 10;
  state.enemies.forEach(en => {
    if (Math.hypot(en.x - x, en.y - y) <= radius) {
      en.hp -= dmg;
      en.hitFlash = 8;
    }
  });
  for (let i = 0; i < 32; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = 1.5 + Math.random() * 6;
    state.particles.push({
      x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
      size: 4 + Math.random() * 5,
      color: i % 2 === 0 ? '#ff3d00' : '#ffd54f',
      life: 30
    });
  }
}

function spawnFloatingText(x, y, text, color = '#fff', size = 15) {

let lastTime = performance.now();
let tickCount = 0;

function update(now) {
  const dt = now - lastTime;
  lastTime = now;
  if (state.paused) return;
  tickCount++;

  if (state.screenShake > 0) state.screenShake *= 0.85;
  if (state.screenShake < 0.5) state.screenShake = 0;

  UNIT_CATALOG.forEach(u => {
    if (state.cardCooldowns[u.id] > 0) {
      state.cardCooldowns[u.id] = Math.max(0, state.cardCooldowns[u.id] - dt);
    }
  });
  if (state.overloadTimer > 0) state.overloadTimer--;

  // 更新左侧【镇门石狮】冲锋
  state.lions.forEach((ln, r) => {
    if (ln.running) {
      ln.x += 11;
      const cy = BOARD_Y + r * CELL_H + CELL_H / 2;
      if (tickCount % 2 === 0) {
        state.particles.push({
          x: ln.x - 20, y: cy + (Math.random() - 0.5) * 18,
          vx: -2, vy: (Math.random() - 0.5) * 2,
          size: 5, color: '#ff6d00', life: 16
        });
      }
      for (let i = state.enemies.length - 1; i >= 0; i--) {
        const e = state.enemies[i];
        if (e.r === r && Math.abs(e.x - ln.x) < 44) {
          e.hp -= 3000;
          e.hitFlash = 8;
          createExplosion(e.x, e.y, 60, 0);
        }
      }
      if (ln.x > canvas.width + 60) {
        ln.running = false;
        ln.active = false;
      }
    }
  });

  if (Math.random() < 0.0045) {
    state.gears.push({
      x: BOARD_X + 60 + Math.random() * (COLS * CELL_W - 120),
      y: BOARD_Y - 15,
      targetY: BOARD_Y + 50 + Math.random() * (ROWS * CELL_H - 100),
      val: 25, life: 600
    });
  }
  state.gears.forEach((g, idx) => {
    if (g.y < g.targetY) g.y += 1.3;
    g.life--;
    if (g.life <= 0) state.gears.splice(idx, 1);
  });

  spawnCounter++;
  const interval = Math.max(85, 240 - state.wave * 14);
  if (spawnCounter >= interval) {
    spawnCounter = 0;
    spawnEnemy();
  }

  state.towers.forEach((t, tIdx) => {
    t.scaleX += (1 - t.scaleX) * 0.16;
    t.scaleY += (1 - t.scaleY) * 0.16;
    if (t.hitFlash > 0) t.hitFlash--;

    const elem = state.elementalTiles[`${t.r}_${t.c}`];
    if (elem === 'earth' && t.hp < t.maxHp) t.hp = Math.min(t.maxHp, t.hp + 0.25);

    let speedMult = 1;
    state.towers.forEach(other => {
      if (other.id === 'furnace' && Math.abs(other.r - t.r) <= 1 && Math.abs(other.c - t.c) <= 1) {
        speedMult = 1.2;
      }
    });
    if (elem === 'fire') speedMult += 0.25;
    if (state.overloadTimer > 0) speedMult *= 2.0;

    t.timer += speedMult;

    if (t.id === 'furnace') {
      const wait = state.activeBuffs.has('gold_furnace') ? 440 : 620;
      if (t.timer >= wait) {
        t.timer = 0;
        t.scaleX = 1.22; t.scaleY = 0.82;
        state.gears.push({ x: t.x + (Math.random() - 0.5) * 28, y: t.y - 10, targetY: t.y + 20, val: 25, life: 600 });
        if (state.activeBuffs.has('gold_furnace') && state.enemies.length > 0) {
          state.enemies.slice(0, 3).forEach(target => {
            state.bullets.push({ x: t.x, y: t.y, r: target.r, vx: 8.5, dmg: 60, color: '#ff6d00', radius: 6 });
          });
        }
      }
    } else if (t.id === 'landmine') {
      if (!t.armed) {
        t.armTimer++;
        if (t.armTimer >= 240) {
          t.armed = true;
          spawnFloatingText(t.x, t.y - 24, '⚡ 埋雷就绪!', '#ffd54f', 13);
        }
      } else {
        const trigger = state.enemies.find(e => e.r === t.r && Math.abs(e.x - t.x) < 38);
        if (trigger) {
          createExplosion(t.x, t.y, 125, 1500);
          spawnFloatingText(t.x, t.y, '💥 震天爆破!', '#ff3d00', 20);
          state.towers.splice(tIdx, 1);
        }
      }
    } else if (t.id === 'taotie') {
      if (t.digesting) {
        t.digestTimer--;
        if (t.digestTimer <= 0) {
          t.digesting = false;
          const bonusQi = state.activeBuffs.has('fast_taotie') ? 50 : 25;
          state.qi += bonusQi;
          spawnFloatingText(t.x, t.y - 20, `炼化 +${bonusQi}灵气`, '#ea80fc', 15);
        }
      } else {
        const preyIdx = state.enemies.findIndex(e => !e.isBoss && e.r === t.r && e.x > t.x - 10 && e.x < t.x + 85);
        if (preyIdx !== -1) {
          state.enemies.splice(preyIdx, 1);
          t.digesting = true;
          t.digestTimer = state.activeBuffs.has('fast_taotie') ? 360 : 720;
          t.scaleX = 1.35; t.scaleY = 1.35;
          spawnFloatingText(t.x, t.y, '👄 饕餮吞噬!', '#ffd54f', 16);
        }
      }
    } else if (t.id === 'shield' && state.activeBuffs.has('lava_shield') && tickCount % 30 === 0) {
      state.enemies.forEach(e => {
        if (e.r === t.r && Math.abs(e.x - t.x) < 75) {
          e.hp -= 32;
          e.hitFlash = 3;
        }
      });
    } else if (t.id === 'crossbow' || t.id === 'frost_mage') {
      const hasEnemy = state.enemies.some(e => e.r === t.r && e.x > t.x);
      if (hasEnemy && t.timer >= 76) {
        t.timer = 0;
        t.shotCount++;
        t.scaleX = 0.84; t.scaleY = 1.18;

        const isFrost = t.id === 'frost_mage';
        const isThunder = !isFrost && state.activeBuffs.has('thunder_bow');
        let dmg = isFrost ? 24 : (isThunder ? 36 : 26);
        if (elem === 'fire') dmg += 8;

        state.bullets.push({
          x: t.x + 22, y: t.y - 4, r: t.r,
          vx: 9.5, dmg, isFrost, isThunder,
          color: isFrost ? '#00e5ff' : (isThunder ? '#e040fb' : '#ffd54f'),
          radius: isFrost ? 6 : 4.5
        });
      }
    }
  });

  for (let i = state.bullets.length - 1; i >= 0; i--) {
    const b = state.bullets[i];
    b.x += b.vx;
    if (b.x > canvas.width + 40) {
      state.bullets.splice(i, 1);
      continue;
    }
    for (let j = state.enemies.length - 1; j >= 0; j--) {
      const e = state.enemies[j];
      if (e.r === b.r && Math.abs(e.x - b.x) < 32 + b.radius) {
        e.hp -= b.dmg;
        e.hitFlash = 5;

        if (b.isFrost) {
          e.chillTimer = 240;
          if (Math.random() < 0.25) e.freezeTimer = 75;
        }
        if (b.isThunder && state.enemies.length > 1) {
          const near = state.enemies.find(o => o !== e && Math.hypot(o.x - e.x, o.y - e.y) < 170);
          if (near) {
            near.hp -= b.dmg * 0.55;
            near.hitFlash = 5;
            state.lightningArcs.push({ x1: e.x, y1: e.y, x2: near.x, y2: near.y, life: 10 });
          }
        }
        for (let k = 0; k < 5; k++) {
          state.particles.push({
            x: b.x, y: b.y,
            vx: (Math.random() - 0.5) * 4.5, vy: (Math.random() - 0.5) * 4.5,
            size: 2.8, color: b.color || '#ffd54f', life: 15
          });
        }
        if (!b.isCrow) {
          state.bullets.splice(i, 1);
          break;
        }
      }
    }
  }

  for (let i = state.lightningArcs.length - 1; i >= 0; i--) {
    state.lightningArcs[i].life--;
    if (state.lightningArcs[i].life <= 0) state.lightningArcs.splice(i, 1);
  }

  for (let i = state.enemies.length - 1; i >= 0; i--) {
    const e = state.enemies[i];
    if (e.hitFlash > 0) e.hitFlash--;
    if (e.chillTimer > 0) e.chillTimer--;
    if (e.freezeTimer > 0) { e.freezeTimer--; continue; }

    const blocker = state.towers.find(t => t.r === e.r && Math.abs(t.x - e.x) < 38);
    if (blocker) {
      if (e.canVault && state.elementalTiles[`${blocker.r}_${blocker.c}`] !== 'earth') {
        e.canVault = false;
        e.x -= 88;
        spawnFloatingText(e.x, e.y - 25, '飞爪翻越!', '#ea80fc', 14);
      } else {
        const dmgRed = (blocker.id === 'taotie' && blocker.digesting && state.activeBuffs.has('fast_taotie')) ? 0.4 : 1;
        blocker.hp -= 0.75 * dmgRed;
        blocker.hitFlash = 2;
        if (blocker.id === 'shield') {
          e.hp -= state.activeBuffs.has('lava_shield') ? 0.85 : 0.35;
        }
        if (blocker.hp <= 0) {
          const idx = state.towers.indexOf(blocker);
          if (idx !== -1) state.towers.splice(idx, 1);
        }
      }
    } else {
      const spdMult = e.chillTimer > 0 ? 0.5 : 1;
      e.x -= e.spd * spdMult;
    }

    if (e.x < BOARD_X - 6) {
      const ln = state.lions[e.r];
      if (ln && ln.active && !ln.running) {
        ln.running = true;
        state.screenShake = 10;
        spawnFloatingText(BOARD_X + 80, e.y, '🦁 镇门石狮咆哮出击！', '#ffd54f', 20);
      } else if (!ln.active) {
        e.x = BOARD_X + COLS * CELL_W;
      }
    }

    if (e.hp <= 0) {
      state.energy = Math.min(100, state.energy + 8);
      waveKills++;
      for (let k = 0; k < 12; k++) {
        state.particles.push({
          x: e.x, y: e.y,
          vx: (Math.random() - 0.5) * 5.5, vy: (Math.random() - 0.5) * 5.5,
          size: 3.5, color: e.tint || '#d4af37', life: 22
        });
      }
      state.enemies.splice(i, 1);

      if (!state.bossSpawned && waveKills >= 5 + state.wave * 2) {
        waveKills = 0;
        if (state.wave < state.maxWave) {
          state.wave++;
          if (state.wave % 3 === 0) showRogueModal();
          if (state.wave === state.maxWave) spawnXiangliuBoss();
        }
      }
      updateHUD();
    }
  }

  for (let i = state.particles.length - 1; i >= 0; i--) {
    const p = state.particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
    if (p.life <= 0) state.particles.splice(i, 1);
  }

  updateHUD();
}

// ==============================================================
// 五、 战场原画渲染管线
// ==============================================================
function render() {
  ctx.save();
  if (state.screenShake > 0) {
    ctx.translate((Math.random() - 0.5) * state.screenShake, (Math.random() - 0.5) * state.screenShake);
  }
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 1. 远景古战场原画背景图 (assets/background.jpg)
  if (RAW_IMAGES.bg && RAW_IMAGES.bg.complete && RAW_IMAGES.bg.naturalWidth > 0) {
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.drawImage(RAW_IMAGES.bg, 0, 0, canvas.width, canvas.height);
    ctx.restore();
  }

  // 2. 左侧【守城底线 · 镇门石狮驻地】
  ctx.fillStyle = 'rgba(12, 18, 23, 0.9)';
  ctx.strokeStyle = '#6e5015';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(14, BOARD_Y - 30, 118, ROWS * CELL_H + 34, 8);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#1f2d37';
  ctx.fillRect(16, BOARD_Y - 28, 114, 24);
  ctx.fillStyle = '#ffecb3';
  ctx.font = 'bold 12px "PingFang SC", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('🦁 底线 · 镇门石狮', 73, BOARD_Y - 12);

  // 3. 绘制 5x9 墨家青石棋盘
  const elemStyles = {
    fire: { color: 'rgba(255, 87, 34, 0.45)', stroke: '#ff7043', label: '🔥火脉·攻速+25%' },
    water: { color: 'rgba(0, 229, 255, 0.42)', stroke: '#00e5ff', label: '💧水脉·减CD30%' },
    earth: { color: 'rgba(255, 193, 7, 0.45)', stroke: '#ffd54f', label: '⛰️土脉·固阵免越' },
    metal: { color: 'rgba(224, 247, 250, 0.38)', stroke: '#e0f7fa', label: '⚔️金脉·破甲' }
  };

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const x = BOARD_X + c * CELL_W;
      const y = BOARD_Y + r * CELL_H;
      const isCore = (c === 1 || c === 2);

      ctx.fillStyle = 'rgba(6, 9, 12, 0.85)';
      ctx.fillRect(x + 2, y + 3, CELL_W - 4, CELL_H - 3);

      const tileGrad = ctx.createLinearGradient(x, y, x, y + CELL_H - 6);
      if (isCore) {
        tileGrad.addColorStop(0, (r + c) % 2 === 0 ? 'rgba(42, 60, 70, 0.88)' : 'rgba(34, 50, 58, 0.88)');
        tileGrad.addColorStop(1, 'rgba(22, 34, 40, 0.92)');
      } else {
        tileGrad.addColorStop(0, (r + c) % 2 === 0 ? 'rgba(30, 44, 52, 0.85)' : 'rgba(24, 36, 43, 0.85)');
        tileGrad.addColorStop(1, 'rgba(16, 24, 29, 0.9)');
      }
      ctx.fillStyle = tileGrad;
      ctx.beginPath();
      ctx.roundRect(x + 2, y + 2, CELL_W - 4, CELL_H - 6, 5);
      ctx.fill();

      ctx.strokeStyle = isCore ? 'rgba(212, 175, 55, 0.42)' : 'rgba(255, 255, 255, 0.07)';
      ctx.lineWidth = 1;
      ctx.strokeRect(x + 3, y + 3, CELL_W - 6, CELL_H - 8);

      const key = `${r}_${c}`;
      if (state.elementalTiles[key]) {
        const st = elemStyles[state.elementalTiles[key]];
        const pulse = (Math.sin(tickCount * 0.06) + 1) * 0.5;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        const grad = ctx.createRadialGradient(
          x + CELL_W / 2, y + CELL_H / 2, 4,
          x + CELL_W / 2, y + CELL_H / 2, CELL_W * 0.45
        );
        grad.addColorStop(0, st.color);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.globalAlpha = 0.65 + pulse * 0.35;
        ctx.fillRect(x + 2, y + 2, CELL_W - 4, CELL_H - 6);
        ctx.restore();

        ctx.fillStyle = st.stroke;
        ctx.font = 'bold 11px "PingFang SC", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(st.label, x + CELL_W / 2, y + CELL_H - 10);
      }
    }
  }

  // 4. 悬停十字光带与原画预览虚影
  if (state.hoverCell.r >= 0 && (state.selectedCard || state.shovelMode)) {
    const { r, c } = state.hoverCell;
    const hx = BOARD_X + c * CELL_W;
    const hy = BOARD_Y + r * CELL_H;
    ctx.save();
    ctx.fillStyle = state.shovelMode ? 'rgba(255, 82, 82, 0.16)' : 'rgba(255, 215, 0, 0.08)';
    ctx.fillRect(BOARD_X, hy, COLS * CELL_W, CELL_H);
    ctx.fillRect(hx, BOARD_Y, CELL_W, ROWS * CELL_H);

    if (state.selectedCard) {
      ctx.globalAlpha = 0.65;
      drawPaintedStandee(ctx, state.selectedCard.id, hx + CELL_W / 2, hy + CELL_H / 2, 78);
    }
    ctx.restore();
  }

  // 5. 绘制场上墨家机关（100% 原画立绘）
  const breath = Math.sin(tickCount * 0.08) * 0.025;
  state.towers.forEach(t => {
    const glow = state.overloadTimer > 0 ? '#ff3d00' : (t.id === 'landmine' && !t.armed ? '#607d8b' : '#d4af37');
    drawPaintedStandee(ctx, t.id, t.x, t.y, 82, {
      scaleX: t.scaleX,
      scaleY: t.scaleY + breath,
      hitFlash: t.hitFlash > 0,
      glowColor: glow
    });

    if (t.hp < t.maxHp) {
      drawHealthBar(t.x - 26, t.y - 46, 52, 5.5, t.hp / t.maxHp, '#00e676');
    }
  });

  // 6. 绘制左侧【guardian_lion.jpg 镇门石狮】
  state.lions.forEach((ln, r) => {
    const cy = BOARD_Y + r * CELL_H + CELL_H / 2;
    if (ln.active) {
      drawPaintedStandee(ctx, 'lion', ln.x, cy, 74, {
        scaleX: 1,
        scaleY: 1 + Math.sin(tickCount * 0.1 + r) * 0.03,
        glowColor: ln.running ? '#ff3d00' : '#d4af37'
      });
    } else {
      ctx.fillStyle = '#546e7a';
      ctx.font = '11px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('已出击', 73, cy + 4);
    }
  });

  // 7. 绘制山海魇魔与相柳 Boss（带迈步动态与受击闪白）
  state.enemies.forEach(e => {
    const walkBob = Math.sin(tickCount * 0.15 + e.walkPhase) * 0.04;
    const size = e.isBoss ? 92 : 78;
    drawPaintedStandee(ctx, e.id, e.x, e.y, size, {
      scaleX: 1 - walkBob * 0.5,
      scaleY: 1 + walkBob,
      hitFlash: e.hitFlash > 0,
      chilled: e.chillTimer > 0,
      glowColor: e.tint || '#ff5252'
    });

    const barW = e.isBoss ? 72 : 50;
    drawHealthBar(e.x - barW / 2, e.y - size / 2 - 10, barW, 5.5, e.hp / e.maxHp, e.isBoss ? '#d500f9' : '#ff5252');
  });

  // 8. 闪电链与弹道
  state.lightningArcs.forEach(arc => {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = '#ea80fc';
    ctx.shadowColor = '#d500f9';
    ctx.shadowBlur = 12;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(arc.x1, arc.y1);
    ctx.lineTo((arc.x1 + arc.x2) / 2 + (Math.random() - 0.5) * 24, (arc.y1 + arc.y2) / 2 + (Math.random() - 0.5) * 24);
    ctx.lineTo(arc.x2, arc.y2);
    ctx.stroke();
    ctx.restore();
  });

  state.bullets.forEach(b => {
    if (b.isCrow) {
      drawPaintedStandee(ctx, 'fire_crow', b.x, b.y, 76, { glowColor: '#ff3d00' });
    } else {
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.globalCompositeOperation = 'lighter';
      ctx.shadowColor = b.color;
      ctx.shadowBlur = 10;
      ctx.fillStyle = b.color;
      ctx.fillRect(-12, -2, 20, 4);
      ctx.beginPath();
      ctx.moveTo(14, 0); ctx.lineTo(5, -6); ctx.lineTo(5, 6);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  });

  // 9. 天工灵气齿轮与粒子飘字
  state.gears.forEach(g => {
    ctx.save();
    ctx.translate(g.x, g.y);
    ctx.rotate(tickCount * 0.04);
    ctx.shadowColor = '#ffd54f';
    ctx.shadowBlur = 12;
    ctx.fillStyle = '#ffca28';
    ctx.strokeStyle = '#fff8e1';
    ctx.lineWidth = 1.5;
    for (let i = 0; i < 8; i++) {
      ctx.rotate(Math.PI / 4);
      ctx.fillRect(-3, -15, 6, 30);
    }
    ctx.beginPath();
    ctx.arc(0, 0, 11, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  });

  state.particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = Math.min(1, p.life / 18);
    if (p.text) {
      ctx.font = `bold ${p.size}px "PingFang SC", "Microsoft YaHei", sans-serif`;
      ctx.fillStyle = p.color;
      ctx.shadowColor = '#000';
      ctx.shadowBlur = 5;
      ctx.textAlign = 'center';
      ctx.fillText(p.text, p.x, p.y);
    } else {
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  });

  ctx.restore();
}

function drawHealthBar(x, y, w, h, ratio, color) {
  ctx.fillStyle = 'rgba(6, 10, 14, 0.9)';
  ctx.strokeStyle = 'rgba(212, 175, 55, 0.7)';
  ctx.lineWidth = 1;
  ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
  ctx.strokeRect(x - 1, y - 1, w + 2, h + 2);
  ctx.fillStyle = color;
  ctx.fillRect(x, y, Math.max(0, w * ratio), h);
}

// 启动加载原画与主循环
initElementalTiles();
loadAllAssets(() => {
  initCardsUI();
  updateHUD();
  function gameLoop(now) {
    update(now);
    render();
    requestAnimationFrame(gameLoop);
  }
  requestAnimationFrame(gameLoop);
});
</script>
