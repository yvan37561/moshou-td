<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>山海机关录：墨守 — 玄墨流金·硬核写实版</title>
  <style>
    :root {
      --gold-bright: #ffe599;
      --gold: #c9a050;
      --gold-dim: #5e471c;
      --cyan-spirit: #00e5ff;
      --obsidian: #080b0e;
      --slate-dark: #10161c;
      --crimson-glow: #ff1744;
      --text-main: #e2dac9;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: radial-gradient(ellipse at 50% 20%, #161f28 0%, #070a0d 70%, #020304 100%);
      color: var(--text-main);
      font-family: "STKaiti", "KaiTi", "Songti SC", "PingFang SC", "Microsoft YaHei", serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* 顶部冷峻黑金状态栏 */
    #top-bar {
      width: 1080px;
      height: 58px;
      background: linear-gradient(180deg, #161e26 0%, #0b0f14 100%);
      border: 1px solid var(--gold-dim);
      border-bottom: 1.5px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      box-shadow: 0 -10px 35px rgba(0,0,0,0.95), inset 0 1px 0 rgba(255, 229, 153, 0.12);
      position: relative;
    }
    .brand-area {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .brand-mark {
      width: 28px;
      height: 28px;
      border: 1.5px solid var(--gold);
      transform: rotate(45deg);
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0e12;
      box-shadow: 0 0 12px rgba(201, 160, 80, 0.35);
    }
    .brand-mark span {
      transform: rotate(-45deg);
      font-size: 14px;
      color: var(--gold-bright);
    }
    .brand-title {
      font-size: 21px;
      font-weight: 900;
      letter-spacing: 5px;
      background: linear-gradient(180deg, #ffffff 0%, #ffe599 45%, #9e762c 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hud-stats {
      display: flex;
      gap: 20px;
      align-items: center;
    }
    .stat-slab {
      background: #070a0d;
      border: 1px solid #382b14;
      border-left: 3px solid var(--gold);
      padding: 5px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.95);
    }
    .stat-label { font-size: 12px; color: #7f8c96; letter-spacing: 1px; }
    .stat-num {
      font-size: 18px;
      font-weight: 700;
      color: var(--gold-bright);
      font-family: "Cinzel", "Segoe UI", sans-serif;
    }
    .overload-btn {
      background: linear-gradient(135deg, #4a0b12 0%, #1f0407 100%);
      color: #ff8a80;
      border: 1px solid #ff1744;
      padding: 7px 20px;
      font-family: inherit;
      font-weight: bold;
      font-size: 14px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 0 16px rgba(255, 23, 68, 0.35), inset 0 0 8px rgba(255, 23, 68, 0.25);
    }
    .overload-btn:hover:not(:disabled) {
      background: linear-gradient(135deg, #8c1122 0%, #38060c 100%);
      color: #fff;
      box-shadow: 0 0 25px rgba(255, 23, 68, 0.8);
      transform: translateY(-1px);
    }
    .overload-btn:disabled {
      border-color: #2c353d;
      color: #455059;
      background: #0a0d10;
      box-shadow: none;
      cursor: not-allowed;
    }

    /* 战场主画布容器 */
    #game-wrapper {
      position: relative;
      width: 1080px;
      height: 560px;
      border-left: 1px solid var(--gold-dim);
      border-right: 1px solid var(--gold-dim);
      background: #06090c;
      box-shadow: 0 25px 70px rgba(0,0,0,0.98);
    }
    canvas { display: block; cursor: crosshair; }

    #tooltip {
      position: absolute;
      pointer-events: none;
      background: rgba(6, 9, 12, 0.96);
      border: 1px solid var(--gold);
      border-left: 3px solid var(--cyan-spirit);
      padding: 10px 14px;
      font-size: 12px;
      color: #cfd8dc;
      box-shadow: 0 10px 30px rgba(0,0,0,0.95);
      display: none;
      z-index: 60;
      max-width: 260px;
      line-height: 1.6;
    }

    /* 底部冷峻黑曜石卡槽栏 */
    #bottom-hud {
      width: 1080px;
      height: 136px;
      background: linear-gradient(180deg, #0f151b 0%, #070a0d 100%);
      border: 1px solid var(--gold-dim);
      border-top: 1.5px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      box-shadow: 0 15px 45px rgba(0,0,0,0.95);
    }
    #card-list {
      display: flex;
      gap: 11px;
      align-items: center;
    }

    /* 硬核黑金棱角卡牌 */
    .unit-card {
      width: 102px;
      height: 116px;
      background: linear-gradient(180deg, #161f28 0%, #090d11 100%);
      border: 1px solid #3d311b;
      position: relative;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      transition: all 0.18s ease;
      box-shadow: 0 6px 16px rgba(0,0,0,0.85);
      clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
    }
    .unit-card::before {
      content: "";
      position: absolute;
      inset: 0;
      border: 1px solid rgba(201, 160, 80, 0.18);
      pointer-events: none;
    }

      transform: translateY(-6px);
      border-color: var(--gold);

    }
    .unit-card.selected {
      transform: translateY(-8px);
      border-color: var(--cyan-spirit);
      box-shadow: 0 0 22px rgba(0, 229, 255, 0.55), inset 0 0 12px rgba(0, 229, 255, 0.2);
    }
    .unit-card.disabled {
      opacity: 0.32;
      filter: grayscale(0.95);
      cursor: not-allowed;
    }
    .card-cost-tag {
      position: absolute;
      top: 4px; left: 6px;
      color: var(--gold-bright);
      font-weight: 800;
      font-size: 13px;
      font-family: "Segoe UI", sans-serif;
      text-shadow: 0 1px 4px #000;
      z-index: 3;
    }
    .card-type-tag {
      position: absolute;
      top: 5px; right: 6px;
      font-size: 10px;
      color: #64ffda;
      letter-spacing: 1px;
      z-index: 3;
    }
    .card-preview-canvas {
      width: 86px;
      height: 82px;
      margin-top: 6px;
      z-index: 2;
    }
    .card-name-strip {
      width: 100%;
      height: 25px;
      background: rgba(4, 6, 8, 0.95);
      border-top: 1px solid rgba(201, 160, 80, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12.5px;
      font-weight: bold;
      color: var(--text-main);
      letter-spacing: 1.5px;
      z-index: 3;
    }
    .cd-mask {
      position: absolute;
      left: 0; bottom: 0;
      width: 100%; height: 0%;
      background: rgba(2, 4, 6, 0.86);
      border-top: 1px solid var(--cyan-spirit);
      z-index: 5;
      pointer-events: none;
    }

    /* 鲁班拆解钳 */
    #shovel-box {
      width: 96px;
      height: 114px;
      background: linear-gradient(180deg, #161f26 0%, #090c10 100%);

      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;

    }
    #shovel-box:hover { border-color: var(--gold); transform: translateY(-3px); }
    #shovel-box.active {
      border-color: var(--crimson-glow);
      background: linear-gradient(180deg, #3b0d14 0%, #140406 100%);
      box-shadow: 0 0 20px rgba(255, 23, 68, 0.6);
    }

    /* 肉鸽三选一弹窗 */
    #rogue-modal {
      position: absolute;
      inset: 0;
      background: rgba(3, 5, 7, 0.92);
      backdrop-filter: blur(8px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-title {
      font-size: 28px;
      font-weight: bold;
      color: var(--gold-bright);
      margin-bottom: 8px;
      letter-spacing: 6px;
    }
    .modal-sub { font-size: 13px; color: #78909c; margin-bottom: 30px; letter-spacing: 1px; }
    .buff-container { display: flex; gap: 24px; }
    .buff-card {
      width: 250px;
      background: linear-gradient(180deg, #162029 0%, #090d11 100%);
      border: 1px solid var(--gold);
      padding: 24px 18px;
      cursor: pointer;
      text-align: center;
      transition: all 0.22s;
      box-shadow: 0 15px 40px rgba(0,0,0,0.95);
    }
    .buff-card:hover {
      transform: translateY(-8px);
      border-color: var(--cyan-spirit);
      box-shadow: 0 15px 40px rgba(0, 229, 255, 0.25);
    }
    .buff-tag {
      display: inline-block;
      font-size: 11px;
      padding: 2px 10px;
      background: rgba(201, 160, 80, 0.15);
      border: 1px solid var(--gold);
      color: var(--gold-bright);
      margin-bottom: 12px;
    }
    .buff-title { font-size: 19px; color: #fff; margin-bottom: 12px; font-weight: bold; letter-spacing: 1px; }
    .buff-desc { font-size: 13px; line-height: 1.7; color: #b0bec5; font-family: sans-serif; }
  </style>
</head>
<body>

  <!-- 顶部导航栏 -->
  <div id="top-bar">
    <div class="brand-area">
      <div class="brand-mark"><span>墨</span></div>

<script>
/**
 * 《山海机关录：墨守》玄墨流金·硬核写实版引擎 v6.0
 * 彻底移除 Q 版圆润几何体，采用折角多面体装甲网格（Faceted Armor Mesh）、
 * 1:7 写实魔将头身比、水墨残影披风物理，以及左侧【墨门·诛妖巨阙剑匣阵】。
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const tooltipEl = document.getElementById('tooltip');

const ROWS = 5, COLS = 9;
const CELL_W = 98, CELL_H = 96;
const BOARD_X = 152, BOARD_Y = 48;

const UNIT_CATALOG = [
  { id: 'furnace', name: '聚灵烘炉', role: '枢机', cost: 50, cd: 4500, hp: 320, desc: '墨家灵能反应鼎。每16秒凝练25灵气；九宫格内机关攻速+15%。' },
  { id: 'crossbow', name: '诸葛连弩', role: '穿甲', cost: 100, cd: 4000, hp: 320, desc: '重型玄铁床弩。高速攒射破甲钢箭，每4次射击触发双连射。' },
  { id: 'shield', name: '玄武重盾', role: '壁垒', cost: 75, cd: 9000, hp: 3600, desc: '先秦黑金棱角巨盾。正面阻截山海凶兽，受击震荡反伤。' },
  { id: 'landmine', name: '震天埋雷', role: '伏火', cost: 25, cd: 10000, hp: 260, desc: '地下旋翼火药机括。布设4秒后锁定，触碰引发1500伤害爆破。' },
  { id: 'taotie', name: '吞天饕餮', role: '噬魔', cost: 150, cd: 8500, hp: 480, desc: '青铜凶兽断头台。瞬秒前方单体魇魔，炼化后析出25灵气。' },
  { id: 'frost_mage', name: '寒霜方士', role: '凛冬', cost: 175, cd: 5500, hp: 320, desc: '玄冥星盘矩阵。发射寒魄刃减速40%，概率直接冻结目标。' },
  { id: 'pear_blossom', name: '暴雨梨花', role: '齐射', cost: 225, cd: 7500, hp: 360, desc: '三联装重型机弩矩阵。每次击发同时覆盖本行及上下相邻共3行。' },
  { id: 'fire_crow', name: '神火飞鸦', role: '天罚', cost: 150, cd: 15000, hp: 9999, desc: '赤金机械战略飞翼。沿本行超低空掠袭，造成1200毁灭焚烧。' }
];

const ROGUE_BUFFS = [
  { id: 'thunder_bow', tag: '天工改造', title: '【雷公连弩】', desc: '诸葛连弩与暴雨梨花淬炼紫电，命中触发连锁闪电弹射且伤害+35%！' },
  { id: 'lava_shield', tag: '天工改造', title: '【熔岩玄武】', desc: '玄武重盾展开赤焰力场，每秒灼烧前方魇魔60点生命且反伤翻倍！' },
  { id: 'gold_furnace', tag: '天工改造', title: '【烈阳金乌炉】', desc: '聚灵烘炉产灵加快30%，且每次产灵自动发射3枚追踪阳炎弹！' },
  { id: 'fast_taotie', tag: '天工改造', title: '【暴食吞天兽】', desc: '吞天饕餮炼化时间减半，消化期获60%减伤且吐出50巨额灵气！' },
  { id: 'mine_shrapnel', tag: '墨家奇术', title: '【草木皆兵】', desc: '鲁班拆解钳返还提至75%，且拆解瞬间在原地引发800伤害爆破！' }
];

let state = {
  qi: 200,
  wave: 1,
  maxWave: 10,
  energy: 50,
  selectedCard: null,
  shovelMode: false,
  hoverCell: { r: -1, c: -1 },
  overloadTimer: 0,
  screenShake: 0,
  paused: false,
  activeBuffs: new Set(),
  elementalTiles: {},
  towers: [],
  enemies: [],
  bullets: [],
  lightningArcs: [],
  swordCleaves: [], // 左侧巨阙剑阵触发的全屏剑罡特效
  gears: [],
  particles: [],
  // 左侧 5 柄【墨门·诛妖巨阙剑匣】状态
  swordArray: [
    { ready: true, cleaving: false, timer: 0 },
    { ready: true, cleaving: false, timer: 0 },
    { ready: true, cleaving: false, timer: 0 },
    { ready: true, cleaving: false, timer: 0 },
    { ready: true, cleaving: false, timer: 0 }
  ],
  cardCooldowns: {},
  bossSpawned: false
};

// ==============================================================
// 一、 玄墨流金 · 硬核多面体装甲与机械渲染引擎 (HardcoreArtEngine)
// ==============================================================
const HardcoreArt = {
  // 辅助：绘制带金属光泽的多边形切面
  drawPolygon(ctx, pts, fill, stroke, lineWidth = 1.5) {
    ctx.beginPath();
    pts.forEach(([x, y], i) => (i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y)));
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lineWidth; ctx.stroke(); }
  },

  // 1. 绘制硬核黑曜石八角机甲底座
  drawObsidianBase(ctx, r = 34, glowColor = '#c9a050', rot = 0) {
    ctx.save();
    // 地面深邃暗影
    ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
    ctx.beginPath();
    ctx.ellipse(0, 8, r + 4, r * 0.68, 0, 0, Math.PI * 2);
    ctx.fill();

    // 八角折边黑金装甲座
    ctx.scale(1, 0.72);
    ctx.rotate(rot);
    const pts = [];
    for (let i = 0; i < 8; i++) {
      const a = (i * Math.PI) / 4 + Math.PI / 8;
      pts.push([Math.cos(a) * r, Math.sin(a) * r]);
    }
    const baseGrad = ctx.createLinearGradient(-r, -r, r, r);
    baseGrad.addColorStop(0, '#26323d');
    baseGrad.addColorStop(0.5, '#0f1419');
    baseGrad.addColorStop(1, '#06080a');
    this.drawPolygon(ctx, pts, baseGrad, glowColor, 2);

    // 内部精密蚀刻能量环
    ctx.strokeStyle = 'rgba(0, 229, 255, 0.35)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.68, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  },

  // 2. 绘制左侧【墨门·诛妖巨阙剑匣】（彻底替代丑陋的玩具推车）
  drawSwordBastion(ctx, x, y, time, isReady) {
    ctx.save();
    ctx.translate(x, y);

    // 剑匣黑金机械底座（固定在城垣上的重型棱角法阵）
    const dockGrad = ctx.createLinearGradient(-38, -26, 38, 26);
    dockGrad.addColorStop(0, '#1e2933');
    dockGrad.addColorStop(0.5, '#0c1116');
    dockGrad.addColorStop(1, '#18222b');
    this.drawPolygon(ctx, [
      [-42, -22], [18, -28], [34, -14], [34, 14], [18, 28], [-42, 22]
    ], dockGrad, isReady ? '#c9a050' : '#2c353d', 1.8);

    // 内部导能槽
    this.drawPolygon(ctx, [
      [-34, -12], [14, -16], [24, 0], [14, 16], [-34, 12]
    ], '#050709', 'rgba(0, 229, 255, 0.25)', 1);

    if (!isReady) {
      ctx.fillStyle = '#455a64';
      ctx.font = '11px "PingFang SC", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('剑阵已发', -4, 4);
      ctx.restore();
      return;
    }

    // 悬浮在剑匣上方的【诛妖巨阙古剑】（水平指向右侧战场，带呼吸悬浮与剑气）
    const hoverX = Math.sin(time * 0.08) * 3;
    ctx.translate(hoverX, 0);

    // 剑身青金灵气光晕
    ctx.shadowColor = '#00e5ff';
    ctx.shadowBlur = 14;

    // 剑柄与玄铁剑格（吞口护手）
    this.drawPolygon(ctx, [
      [-38, -3], [-22, -3], [-22, 3], [-38, 3]
    ], '#5e471c', '#ffe599', 1.2);
    this.drawPolygon(ctx, [
      [-24, -16], [-14, -8], [-16, 0], [-14, 8], [-24, 16], [-20, 0]
    ], '#c9a050', '#fff', 1.5);

    // 巨阙宽刃剑身（上下双血槽折面）
    const bladeGrad = ctx.createLinearGradient(-16, -8, 44, 8);
    bladeGrad.addColorStop(0, '#e0f7fa');
    bladeGrad.addColorStop(0.4, '#4dd0e1');
    bladeGrad.addColorStop(0.8, '#00838f');
    bladeGrad.addColorStop(1, '#ffffff');
    this.drawPolygon(ctx, [
      [-16, -8], [28, -6], [46, 0], [28, 6], [-16, 8]
    ], bladeGrad, '#e0f7fa', 1.2);

    // 剑脊中心金色铭文线
    ctx.strokeStyle = '#ffe599';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-14, 0);
    ctx.lineTo(40, 0);
    ctx.stroke();

    ctx.restore();
  },

  // 3. 绘制 8 大硬核墨家机关（卡牌与棋盘 100% 共用）
  drawTowerUnit(ctx, id, time = 0, opts = {}) {
    const { isOverload = false, armed = true, digesting = false, hasThunder = false, hasLava = false } = opts;
    const rimColor = isOverload ? '#ff1744' : '#c9a050';

    ctx.save();
    if (id !== 'landmine' && id !== 'fire_crow') {
      this.drawObsidianBase(ctx, 35, rimColor, id === 'furnace' ? time * 0.01 : 0);
    }

    switch (id) {
      case 'furnace': {
        // 【聚灵烘炉】：黑金八角反应釜 + 四象锁灵柱 + 悬浮太极金核
        // 四角锁灵高塔柱
        [[-20, -14], [20, -14], [-20, 10], [20, 10]].forEach(([px, py]) => {
          this.drawPolygon(ctx, [
            [px - 4, py - 14], [px + 4, py - 14], [px + 6, py + 6], [px - 6, py + 6]
          ], '#182229', '#c9a050', 1.4);
        });

        // 反应釜多面体装甲外环
        const coreGrad = ctx.createLinearGradient(-20, -20, 20, 20);
        coreGrad.addColorStop(0, '#37474f');
        coreGrad.addColorStop(0.5, '#161f26');
        coreGrad.addColorStop(1, '#090d10');
        this.drawPolygon(ctx, [
          [-12, -22], [12, -22], [22, -10], [22, 8], [12, 20], [-12, 20], [-22, 8], [-22, -10]
        ], coreGrad, '#ffe599', 1.8);

        // 核心聚变灵能球
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        const pulse = 12 + Math.sin(time * 0.12) * 2.5;
        const g = ctx.createRadialGradient(0, -2, 2, 0, -2, pulse);
        g.addColorStop(0, '#ffffff');
        g.addColorStop(0.4, '#ffe599');
        g.addColorStop(0.8, '#ff6d00');
        g.addColorStop(1, 'rgba(255, 109, 0, 0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(0, -2, pulse, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        break;
      }

      case 'crossbow':
      case 'pear_blossom': {
        const isMulti = id === 'pear_blossom';
        // 【诸葛连弩 / 暴雨梨花】：棱角分明的黑金重装炮塔 + 机械复合钢翼 + 破甲长枪箭
        const bowGlow = hasThunder ? '#d500f9' : (isMulti ? '#ff3d00' : '#c9a050');

        // 前掠式折角机械钢弓翼（非圆弧，采用硬核机甲折角）
        this.drawPolygon(ctx, [
          [4, -6], [14, -32], [24, -26], [14, -4],
          [24, 18], [14, 24], [4, -2]
        ], '#1c262e', bowGlow, 2);

        // 高张力合金弦
        ctx.strokeStyle = hasThunder ? '#ea80fc' : '#90a4ae';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(18, -29); ctx.lineTo(-16, -4); ctx.lineTo(18, 21);
        ctx.stroke();

        // 重装棱角弩匣主体
        const hullGrad = ctx.createLinearGradient(-26, -14, 16, 10);
        hullGrad.addColorStop(0, '#2c3b47');
        hullGrad.addColorStop(0.5, '#141c22');
        hullGrad.addColorStop(1, '#080b0e');
        this.drawPolygon(ctx, [
          [-26, -10], [8, -14], [18, -4], [8, 6], [-26, 2]
        ], hullGrad, '#c9a050', 1.6);

        // 待发破甲重箭（锋利菱形枪头）
        const angles = isMulti ? [-0.22, 0, 0.22] : [0];
        angles.forEach(ang => {
          ctx.save();
          ctx.translate(0, -4);
          ctx.rotate(ang);
          ctx.fillStyle = hasThunder ? '#e040fb' : '#ffe599';
          ctx.fillRect(-16, -1.5, 36, 3);
          this.drawPolygon(ctx, [
            [32, 0], [18, -6], [22, 0], [18, 6]
          ], hasThunder ? '#00e5ff' : '#ffffff', bowGlow, 1);
          ctx.restore();
        });
        break;
      }

      case 'shield': {
        // 【玄武重盾】：先秦黑金棱角重装壁垒（彻底去Q化，如同机械盾墙）
        const shGrad = ctx.createLinearGradient(-16, -30, 24, 26);
        if (hasLava) {
          shGrad.addColorStop(0, '#ff3d00');
          shGrad.addColorStop(0.5, '#4a0b0b');
          shGrad.addColorStop(1, '#1a0303');
        } else {
          shGrad.addColorStop(0, '#37474f');
          shGrad.addColorStop(0.5, '#151d24');
          shGrad.addColorStop(1, '#070a0d');
        }
        // 主盾多面体装甲板
        this.drawPolygon(ctx, [
          [-8, -30], [16, -26], [24, -4], [16, 20], [-8, 24], [-18, -3]
        ], shGrad, hasLava ? '#ff9100' : '#c9a050', 2.5);

        // 两侧副翼装甲片
        this.drawPolygon(ctx, [
          [6, -28], [22, -18], [22, 12], [6, 22], [12, -3]
        ], 'rgba(0,0,0,0.45)', '#ffe599', 1.2);

        // 中心能量棱晶
        this.drawPolygon(ctx, [
          [8, -14], [18, -3], [8, 8], [-2, -3]
        ], hasLava ? '#ff6d00' : '#00e5ff', '#ffffff', 1.2);
        break;
      }

      case 'landmine': {
        // 【震天埋雷】：黑曜石八角旋刃地雷
        ctx.save();
        if (!armed) ctx.globalAlpha = 0.55;
        ctx.scale(1, 0.72);
        ctx.rotate(armed ? time * 0.03 : 0);

        for (let i = 0; i < 6; i++) {
          ctx.rotate(Math.PI / 3);
          this.drawPolygon(ctx, [
            [0, -28], [8, -14], [-8, -14]
          ], '#1c262e', armed ? '#ff1744' : '#607d8b', 1.5);
        }
        this.drawPolygon(ctx, [
          [-14, -14], [14, -14], [18, 0], [14, 14], [-14, 14], [-18, 0]
        ], '#0b0f14', '#c9a050', 2);

        const pulse = armed ? (Math.sin(time * 0.25) + 1) * 0.5 : 0;
        ctx.fillStyle = armed ? '#ff1744' : '#455a64';
        ctx.shadowColor = '#ff1744';
        ctx.shadowBlur = armed ? 15 : 0;
        ctx.beginPath();
        ctx.arc(0, 0, 6 + pulse * 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        break;
      }

      case 'taotie': {
        // 【吞天饕餮】：冷峻三星堆青铜纵目机甲魔首 + 机械断头巨颚
        // 冲天折角青铜巨耳/双角
        [-1, 1].forEach(dir => {
          this.drawPolygon(ctx, [
            [-6, dir * 12], [-24, dir * 30], [-6, dir * 28], [8, dir * 16]
          ], '#182426', '#c9a050', 1.8);
        });

        // 棱角青铜兽面核心
        this.drawPolygon(ctx, [
          [-20, -18], [14, -22], [24, -4], [14, 16], [-20, 12], [-26, -3]
        ], digesting ? '#260e36' : '#0f2124', digesting ? '#d500f9' : '#00e5ff', 2);

        // 机械锯齿巨颚
        const bite = digesting ? 2 : 9 + Math.sin(time * 0.12) * 3;
        this.drawPolygon(ctx, [
          [4, -bite], [22, -bite - 3], [18, 0], [22, bite + 3], [4, bite]
        ], '#050709', '#ffe599', 1.4);

        // 冷酷菱形金瞳
        this.drawPolygon(ctx, [[-10, -12], [-2, -9], [-10, -6], [-14, -9]], '#ffe599', null);
        this.drawPolygon(ctx, [[-10, 4], [-2, 7], [-10, 10], [-14, 7]], '#ffe599', null);
        break;
      }

      case 'frost_mage': {
        // 【寒霜方士】：玄冥四象棱镜矩阵
        ctx.save();
        const floatY = Math.sin(time * 0.08) * 3;
        ctx.translate(0, floatY);

        // 左右悬浮护法冰刃
        [-22, 22].forEach(px => {
          this.drawPolygon(ctx, [
            [px, -22], [px + 5, -4], [px, 12], [px - 5, -4]
          ], '#0277bd', '#80d8ff', 1.4);
        });

        // 中央主玄冰八面体晶碑
        const iceGrad = ctx.createLinearGradient(-12, -30, 12, 16);
        iceGrad.addColorStop(0, '#e1f5fe');
        iceGrad.addColorStop(0.45, '#00b0ff');
        iceGrad.addColorStop(1, '#01274a');
        this.drawPolygon(ctx, [
          [0, -30], [14, -8], [0, 14], [-14, -8]
        ], iceGrad, '#ffffff', 1.8);
        ctx.restore();
        break;
      }

      case 'fire_crow': {
        // 【神火飞鸦】：暗金超音速掠袭机关鸢（锐利三角翼机身）
        const flap = Math.sin(time * 0.35) * 5;
        const wGrad = ctx.createLinearGradient(-24, 0, 26, 0);
        wGrad.addColorStop(0, '#870000');
        wGrad.addColorStop(0.5, '#ff3d00');
        wGrad.addColorStop(1, '#ffe599');
        this.drawPolygon(ctx, [
          [28, 0], [0, -28 + flap], [-14, -8], [-28, -12], [-18, 0], [-28, 12], [-14, 8], [0, 28 - flap]
        ], wGrad, '#ffe599', 1.6);
        break;
      }
    }
    ctx.restore();
  },

  // 4. 硬核暗黑国风 · 写实比例山海魇魔建模（1:7 修长头身比 + 折角重甲 + 动态水墨披风）
  drawHardcoreMonster(ctx, e, time) {
    const { typeId, hitFlash, chillTimer, freezeTimer, walkPhase, isAttacking } = e;
    const t = time * 0.13 + walkPhase;
    const stride = Math.sin(t) * 8;
    const bob = Math.abs(Math.cos(t)) * -2.5;
    const slash = isAttacking ? Math.sin(time * 0.48) * 1.1 : Math.cos(t) * 0.18;

    ctx.save();
    ctx.translate(e.x, e.y);

    // 地面冷峻投影与黑雾气场
    ctx.fillStyle = 'rgba(0, 0, 0, 0.72)';
    ctx.beginPath();
    ctx.ellipse(0, 22, 24, 7, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.translate(0, bob);
    if (hitFlash > 0) {
      ctx.filter = 'brightness(280%) contrast(160%)';
    } else if (chillTimer > 0) {
      ctx.filter = 'hue-rotate(170deg) saturate(180%)';
    }

    switch (typeId) {
      case 'soldier': {
        // 【玄甲宿卫·秦俑】：修长冷酷的先秦重装长戟武士（非圆头娃娃）
        // 1. 身后飘动的残破暗红水墨披风
        const capeWave = Math.sin(t * 1.5) * 6;
        this.drawPolygon(ctx, [
          [2, -24], [24, -12 + capeWave], [30, 14 - capeWave], [12, 18], [4, -4]
        ], 'rgba(110, 18, 24, 0.88)', '#3d080c', 1.2);

        // 2. 修长铁甲战靴双腿（折角胫甲）
        this.drawPolygon(ctx, [
          [-6 + stride, 2], [-1 + stride, 2], [-3 + stride, 22], [-9 + stride, 22]
        ], '#161d24', '#607d8b', 1.2);
        this.drawPolygon(ctx, [
          [2 - stride, 2], [7 - stride, 2], [5 - stride, 22], [-1 - stride, 22]
        ], '#11171c', '#455a64', 1.2);

        // 3. 窄腰宽肩玄铁胸甲与吞肩兽铠（倒三角黄金武士比例）
        const chestGrad = ctx.createLinearGradient(-14, -26, 14, 6);
        chestGrad.addColorStop(0, '#37474f');
        chestGrad.addColorStop(0.5, '#182026');
        chestGrad.addColorStop(1, '#090c0f');
        // 腰甲裙甲
        this.drawPolygon(ctx, [
          [-9, -2], [9, -2], [13, 11], [0, 14], [-13, 11]
        ], '#1c252c', '#c9a050', 1.3);
        // 倒梯形胸甲
        this.drawPolygon(ctx, [
          [-14, -24], [14, -24], [8, 0], [-8, 0]
        ], chestGrad, '#c9a050', 1.6);
        // 双肩尖刺披膊
        this.drawPolygon(ctx, [[-14, -25], [-22, -16], [-12, -12]], '#263238', '#ffe599', 1.2);
        this.drawPolygon(ctx, [[14, -25], [22, -16], [12, -12]], '#263238', '#ffe599', 1.2);

        // 4. 冷酷折角铁面战盔（V型面甲+高耸盔缨，绝不用圆球画头）
        this.drawPolygon(ctx, [
          [-7, -38], [7, -38], [9, -25], [0, -21], [-9, -25]
        ], '#1e272e', '#c9a050', 1.5);
        // 猩红横向护目镜魂光
        ctx.fillStyle = '#ff1744';
        ctx.shadowColor = '#ff1744';
        ctx.shadowBlur = 8;
        ctx.fillRect(-7, -31, 11, 2.5);
        ctx.shadowBlur = 0;

        // 5. 双手斜指前方的【先秦青铜方天长戟】
        ctx.save();
        ctx.translate(-4, -10);
        ctx.rotate(slash - 0.15);
        // 64px 修长黑铁戟杆
        ctx.strokeStyle = '#5d4037';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(22, 6); ctx.lineTo(-42, -6);
        ctx.stroke();
        // 锋利月牙戟刃与枪尖
        this.drawPolygon(ctx, [
          [-42, -6], [-56, -9], [-44, -3]
        ], '#eceff1', '#fff', 1);
        this.drawPolygon(ctx, [
          [-34, -5], [-42, -18], [-26, -12], [-30, 6], [-42, 8]
        ], '#c9a050', '#ffe599', 1.2);
        ctx.restore();
        break;
      }

      case 'rattan': {
        // 【枯木鬼藤·尸魔】：扭曲高大的暗黑树魔重盾手
        // 双腿枯木根须
        this.drawPolygon(ctx, [[-7 + stride, 2], [-2 + stride, 2], [-4 + stride, 22], [-10 + stride, 22]], '#1b2614', '#558b2f', 1.2);
        this.drawPolygon(ctx, [[3 - stride, 2], [8 - stride, 2], [6 - stride, 22], [0 - stride, 22]], '#1b2614', '#558b2f', 1.2);

        // 躯干与胸口翠绿妖核
        this.drawPolygon(ctx, [
          [-15, -26], [15, -24], [10, 8], [-10, 8]
        ], '#1a2912', '#689f38', 1.6);

        // 鹿角枯木骷髅面甲
        this.drawPolygon(ctx, [
          [-8, -38], [8, -38], [6, -23], [-6, -23]
        ], '#2e3d23', '#aed581', 1.5);
        // 峥嵘枯枝长角
        ctx.strokeStyle = '#8d6e63';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(-5, -38); ctx.lineTo(-16, -50); ctx.lineTo(-22, -46);
        ctx.moveTo(5, -38); ctx.lineTo(16, -50); ctx.lineTo(22, -46);
        ctx.stroke();

        // 前置巨型尖刺古藤塔盾（棱角多边形，带发光毒脉）
        ctx.save();
        ctx.translate(-14, -6);
        ctx.rotate(slash * 0.25);
        this.drawPolygon(ctx, [
          [0, -26], [10, -16], [10, 18], [0, 26], [-12, 16], [-12, -16]
        ], '#253b18', '#9ccc65', 2);
        // 盾面妖藤核心
        this.drawPolygon(ctx, [
          [0, -14], [5, 0], [0, 14], [-5, 0]
        ], '#76ff03', '#ffffff', 1);
        ctx.restore();
        break;
      }

      case 'ape': {
        // 【赤发夜叉·山魈】：精悍修长的刺客型鬼影夜叉
        ctx.save();
        ctx.rotate(-0.22); // 极速突进前倾角

        // 逆风狂舞的三股赤焰长发
        ctx.fillStyle = '#d50000';
        [-6, 0, 6].forEach((dy, idx) => {
          const w = Math.sin(t * 2 + idx) * 7;
          this.drawPolygon(ctx, [
            [0, -28 + dy * 0.5], [28, -34 + dy + w], [18, -20 + dy]
          ], '#b71c1c', '#ff5252', 1);
        });

        // 弓步反关节修长双腿
        this.drawPolygon(ctx, [[-8 + stride, 0], [-2 + stride, 0], [-6 + stride, 20], [-12 + stride, 20]], '#1a1226', '#7c4dff', 1.2);
        this.drawPolygon(ctx, [[4 - stride, 0], [10 - stride, 0], [6 - stride, 20], [0 - stride, 20]], '#1a1226', '#7c4dff', 1.2);

        // 精悍倒三角夜叉魔躯
        this.drawPolygon(ctx, [
          [-13, -24], [11, -22], [6, 2], [-7, 2]
        ], '#211533', '#b388ff', 1.5);

        // 惨白獠牙鬼面具
        this.drawPolygon(ctx, [
          [-11, -34], [3, -34], [5, -22], [-4, -19], [-12, -24]
        ], '#cfd8dc', '#37474f', 1.4);
        ctx.fillStyle = '#ffea00';
        ctx.fillRect(-10, -29, 6, 2.5);

        // 双臂反握的新月寒光斩刃
        ctx.save();
        ctx.translate(-10, -8);
        ctx.rotate(slash);
        this.drawPolygon(ctx, [
          [0, 0], [-26, -8], [-14, 4], [4, 4]
        ], '#00e5ff', '#ffffff', 1.2);
        ctx.restore();

        ctx.restore();
        break;
      }

      case 'hammer': {
        // 【镇狱铁浮屠·巨灵】：压迫感十足的重装魔神（高耸肩甲塔 + 熔炉胸核 + 巨型棱锤）
        // 粗壮重甲战靴
        this.drawPolygon(ctx, [[-12 + stride * 0.6, 2], [-2 + stride * 0.6, 2], [-4 + stride * 0.6, 24], [-14 + stride * 0.6, 24]], '#0f1418', '#90a4ae', 1.5);
        this.drawPolygon(ctx, [[4 - stride * 0.6, 2], [14 - stride * 0.6, 2], [12 - stride * 0.6, 24], [2 - stride * 0.6, 24]], '#0f1418', '#90a4ae', 1.5);

        // 魁梧八角重装甲躯干
        const juggGrad = ctx.createLinearGradient(-20, -34, 20, 12);
        juggGrad.addColorStop(0, '#455a64');
        juggGrad.addColorStop(0.5, '#182026');
        juggGrad.addColorStop(1, '#070a0d');
        this.drawPolygon(ctx, [
          [-20, -30], [20, -30], [24, -10], [14, 10], [-14, 10], [-24, -10]
        ], juggGrad, '#c9a050', 2.2);

        // 胸口镇狱熔炉裂隙
        this.drawPolygon(ctx, [
          [0, -22], [8, -10], [0, 2], [-8, -10]
        ], '#ff3d00', '#ffe599', 1.4);

        // 魔神冲天双角重盔
        this.drawPolygon(ctx, [[-10, -32], [-24, -50], [-4, -38]], '#c9a050', '#ffe599', 1.4);
        this.drawPolygon(ctx, [[10, -32], [24, -50], [4, -38]], '#c9a050', '#ffe599', 1.4);
        this.drawPolygon(ctx, [[-9, -42], [9, -42], [11, -28], [-11, -28]], '#10161b', '#c9a050', 1.8);
        ctx.fillStyle = '#ff1744';
        ctx.fillRect(-8, -36, 12, 3);

        // 高举挥砸的【八棱破城重锤】
        ctx.save();
        ctx.translate(6, -16);
        ctx.rotate(slash * 1.3);
        ctx.fillStyle = '#3e2723';
        ctx.fillRect(-3, -38, 6, 38);
        this.drawPolygon(ctx, [
          [-16, -48], [16, -48], [20, -34], [12, -24], [-12, -24], [-20, -34]
        ], '#263238', '#ffe599', 2);
        ctx.restore();
        break;
      }

      case 'boss_head': {
        // 【九首凶神·相柳】：棱角分明的暗黑龙蛇妖首（告别圆球串联）
        for (let k = 3; k >= 1; k--) {
          const sx = k * 18;
          const sy = Math.sin(time * 0.12 + k + walkPhase) * 6;
          this.drawPolygon(ctx, [
            [sx - 12, sy - 14], [sx + 12, sy - 10], [sx + 14, sy + 12], [sx - 10, sy + 14]
          ], '#092624', '#00bfa5', 1.5);
        }

        // 凶悍折角龙蛇首与背棘
        this.drawPolygon(ctx, [
          [-34, 4], [-10, -24], [22, -16], [16, 0], [22, 16], [-10, 22]
        ], '#004d40', '#64ffda', 2.2);
        this.drawPolygon(ctx, [[-6, -22], [18, -36], [8, -18]], '#c9a050', '#ffe599', 1.4);

        // 竖瞳龙目与碧绿吐息电漿
        this.drawPolygon(ctx, [[-14, -8], [-4, -12], [-6, -4]], '#ffea00', null);
        ctx.fillStyle = '#00e676';
        ctx.shadowColor = '#00e676';
        ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.arc(-32, 4, 6 + Math.sin(time * 0.2) * 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        break;
      }
    }

    if (freezeTimer > 0) {
      this.drawPolygon(ctx, [
        [-22, 22], [-18, -32], [0, -46], [18, -30], [22, 22]
      ], 'rgba(0, 176, 255, 0.45)', '#e1f5fe', 2);
    }

    ctx.restore();

    const barW = e.isBoss ? 74 : 48;
    drawHealthBar(e.x - barW / 2, e.y - 54, barW, 5, e.hp / e.maxHp, e.isBoss ? '#d500f9' : '#ff1744');
  }
};

// ==============================================================
// 二、 界面与实时同步卡牌初始化
// ==============================================================
function initElementalTiles() {
  const types = ['fire', 'water', 'earth', 'metal'];
  state.elementalTiles = {};
  for (let i = 0; i < 6; i++) {
    const r = Math.floor(Math.random() * ROWS);
    const c = 1 + Math.floor(Math.random() * (COLS - 3));
    state.elementalTiles[`${r}_${c}`] = types[i % types.length];
  }
}

function renderCardPreviews(time) {

function showTooltip(e, html) {
  tooltipEl.innerHTML = html;

  const rect = document.getElementById('game-wrapper').getBoundingClientRect();
  tooltipEl.style.left = `${Math.min(800, Math.max(12, e.clientX - rect.left + 16))}px`;
  tooltipEl.style.top = `${Math.max(12, e.clientY - rect.top - 55)}px`;
}
function hideTooltip() {
  tooltipEl.style.display = 'none';
}

function selectCard(unit) {
  if (state.paused) return;
  if (state.qi < unit.cost || state.cardCooldowns[unit.id] > 0) return;
  state.shovelMode = false;
  document.getElementById('shovel-box').classList.remove('active');
  state.selectedCard = (state.selectedCard && state.selectedCard.id === unit.id) ? null : unit;
  updateHUD();
}

function toggleShovel() {
  state.selectedCard = null;
  state.shovelMode = !state.shovelMode;
  document.getElementById('shovel-box').classList.toggle('active', state.shovelMode);
  updateHUD();
}

function triggerGlobalOverload() {
  if (state.energy < 50 || state.overloadTimer > 0) return;
  state.energy -= 50;
  state.overloadTimer = 420;
  state.screenShake = 12;
  spawnFloatingText(BOARD_X + 420, BOARD_Y + 220, '⚡ 矩子神机 · 全军机巧过载！', '#ffe599', 26);
  updateHUD();
}

function updateHUD() {
  document.getElementById('qi-display').innerText = Math.floor(state.qi);
  document.getElementById('wave-display').innerText = state.bossSpawned ? 'BOSS · 相柳' : `${String(state.wave).padStart(2, '0')} / 10`;
  document.getElementById('energy-display').innerText = `${Math.floor(state.energy)}%`;
  document.getElementById('overload-btn').disabled = state.energy < 50 || state.overloadTimer > 0;
  document.getElementById('shovel-rate').innerText = state.activeBuffs.has('mine_shrapnel') ? '返75%+爆破' : '回收 40%';

  UNIT_CATALOG.forEach(u => {
    const el = document.getElementById(`card-${u.id}`);
    const cdEl = document.getElementById(`cd-${u.id}`);
    const canAfford = state.qi >= u.cost && state.cardCooldowns[u.id] <= 0;
    el.classList.toggle('disabled', !canAfford);
    el.classList.toggle('selected', state.selectedCard && state.selectedCard.id === u.id);
    const ratio = Math.max(0, state.cardCooldowns[u.id] / u.cd) * 100;
    cdEl.style.height = `${ratio}%`;
  });
}

// 三、 战场交互与全屏剑罡/战斗逻辑
// ==============================================================
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  // 悬停在左侧【墨门·诛妖巨阙剑匣】区域时弹出清晰说明
  if (mx >= 16 && mx <= BOARD_X - 8 && my >= BOARD_Y && my <= BOARD_Y + ROWS * CELL_H) {
    showTooltip(e, `<b style="color:#00e5ff">【护城底线 · 诛妖巨阙剑匣】</b><br>墨门终极守城剑阵。当任何魇魔突破防线触及底线时，巨阙古剑将自动解封，化为一道贯穿全行的青金剑罡斩灭整行全部敌人！`);
    state.hoverCell = { r: -1, c: -1 };
    return;
  } else {
    hideTooltip();
  }

  const c = Math.floor((mx - BOARD_X) / CELL_W);
  const r = Math.floor((my - BOARD_Y) / CELL_H);
  state.hoverCell = (r >= 0 && r < ROWS && c >= 0 && c < COLS) ? { r, c } : { r: -1, c: -1 };
});

canvas.addEventListener('click', e => {
  if (state.paused) return;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  for (let i = state.gears.length - 1; i >= 0; i--) {
    const g = state.gears[i];
    if (Math.hypot(mx - g.x, my - g.y) < 32) {
      state.qi += g.val;
      spawnFloatingText(g.x, g.y, `+${g.val} 灵气`, '#ffe599', 16);
      state.gears.splice(i, 1);
      updateHUD();
      return;
    }
  }

  const { r, c } = state.hoverCell;
  if (r < 0 || c < 0) return;

  const existingIdx = state.towers.findIndex(t => t.r === r && t.c === c);

  if (state.shovelMode) {
    if (existingIdx !== -1) {
      const removed = state.towers[existingIdx];
      const rate = state.activeBuffs.has('mine_shrapnel') ? 0.75 : 0.4;
      const refund = Math.floor(removed.cost * rate);
      state.qi += refund;
      spawnFloatingText(removed.x, removed.y, `回收 +${refund}`, '#00e5ff', 16);
      if (state.activeBuffs.has('mine_shrapnel')) {
        createExplosion(removed.x, removed.y, 130, 800);
      }
      state.towers.splice(existingIdx, 1);
      state.shovelMode = false;
      document.getElementById('shovel-box').classList.remove('active');
      updateHUD();
    }
    return;
  }

  if (state.selectedCard && existingIdx === -1) {
    const u = state.selectedCard;
    const elem = state.elementalTiles[`${r}_${c}`];
    state.qi -= u.cost;
    state.cardCooldowns[u.id] = elem === 'water' ? u.cd * 0.7 : u.cd;

    const x = BOARD_X + c * CELL_W + CELL_W / 2;
    const y = BOARD_Y + r * CELL_H + CELL_H / 2;

    if (u.id === 'fire_crow') {
      spawnFireCrowRow(r, y);
    } else {
      state.towers.push({
        id: u.id, name: u.name, r, c, x, y,
        hp: u.hp, maxHp: u.hp, cost: u.cost,
        timer: 0, shotCount: 0,
        armed: u.id !== 'landmine', armTimer: 0,
        digesting: false, digestTimer: 0,
        scaleX: 1.3, scaleY: 0.7, hitFlash: 0
      });
    }

    for (let i = 0; i < 12; i++) {
      state.particles.push({
        x, y: y + 14,
        vx: (Math.random() - 0.5) * 5, vy: (Math.random() - 1) * 3.5,
        size: 2.5 + Math.random() * 2.5, color: '#c9a050', life: 22
      });
    }
    state.selectedCard = null;
    updateHUD();
  }
});

let spawnCounter = 0;
let waveKills = 0;

let lastTime = performance.now();
let tickCount = 0;

function update(now) {
  const dt = now - lastTime;
  lastTime = now;
  if (state.paused) return;
  tickCount++;

  if (state.screenShake > 0) state.screenShake *= 0.85;
  if (state.screenShake < 0.5) state.screenShake = 0;

  UNIT_CATALOG.forEach(u => {
    if (state.cardCooldowns[u.id] > 0) {
      state.cardCooldowns[u.id] = Math.max(0, state.cardCooldowns[u.id] - dt);
    }
  });
  if (state.overloadTimer > 0) state.overloadTimer--;

  for (let i = state.swordCleaves.length - 1; i >= 0; i--) {
    state.swordCleaves[i].life--;
    if (state.swordCleaves[i].life <= 0) state.swordCleaves.splice(i, 1);
  }

  // 天降灵气齿轮
  if (Math.random() < 0.0045) {
    state.gears.push({
      x: BOARD_X + 60 + Math.random() * (COLS * CELL_W - 120),
      y: BOARD_Y - 15,
      targetY: BOARD_Y + 50 + Math.random() * (ROWS * CELL_H - 100),
      val: 25, life: 600
    });
  }
  state.gears.forEach((g, idx) => {
    if (g.y < g.targetY) g.y += 1.3;
    g.life--;
    if (g.life <= 0) state.gears.splice(idx, 1);
  });

  spawnCounter++;
  const interval = Math.max(85, 240 - state.wave * 14);
  if (spawnCounter >= interval) {
    spawnCounter = 0;
    spawnEnemy();
  }

  // 更新机关单位
  state.towers.forEach((t, tIdx) => {
    t.scaleX += (1 - t.scaleX) * 0.16;
    t.scaleY += (1 - t.scaleY) * 0.16;
    if (t.hitFlash > 0) t.hitFlash--;

    const elem = state.elementalTiles[`${t.r}_${t.c}`];
    if (elem === 'earth' && t.hp < t.maxHp) t.hp = Math.min(t.maxHp, t.hp + 0.25);

    let speedMult = 1;
    state.towers.forEach(other => {
      if (other.id === 'furnace' && Math.abs(other.r - t.r) <= 1 && Math.abs(other.c - t.c) <= 1) {
        speedMult = 1.2;
      }
    });
    if (elem === 'fire') speedMult += 0.25;
    if (state.overloadTimer > 0) speedMult *= 2.0;

    t.timer += speedMult;

    if (t.id === 'furnace') {
      const wait = state.activeBuffs.has('gold_furnace') ? 440 : 620;
      if (t.timer >= wait) {
        t.timer = 0;
        t.scaleX = 1.25; t.scaleY = 0.8;
        state.gears.push({ x: t.x + (Math.random() - 0.5) * 28, y: t.y - 10, targetY: t.y + 20, val: 25, life: 600 });
        if (state.activeBuffs.has('gold_furnace') && state.enemies.length > 0) {
          state.enemies.slice(0, 3).forEach(target => {
            state.bullets.push({ x: t.x, y: t.y, r: target.r, vx: 8.5, dmg: 60, color: '#ff6d00', radius: 6 });
          });
        }
      }
    } else if (t.id === 'landmine') {
      if (!t.armed) {
        t.armTimer++;
        if (t.armTimer >= 240) {
          t.armed = true;
          spawnFloatingText(t.x, t.y - 24, '⚡ 伏火锁定!', '#ffe599', 13);
        }
      } else {
        const trigger = state.enemies.find(e => e.r === t.r && Math.abs(e.x - t.x) < 38);
        if (trigger) {
          createExplosion(t.x, t.y, 125, 1500);
          spawnFloatingText(t.x, t.y, '💥 震天爆破!', '#ff1744', 20);
          state.towers.splice(tIdx, 1);
        }
      }
    } else if (t.id === 'taotie') {
      if (t.digesting) {
        t.digestTimer--;
        if (t.digestTimer <= 0) {
          t.digesting = false;
          const bonusQi = state.activeBuffs.has('fast_taotie') ? 50 : 25;
          state.qi += bonusQi;
          spawnFloatingText(t.x, t.y - 20, `炼化 +${bonusQi}灵气`, '#ea80fc', 15);
        }
      } else {
        const preyIdx = state.enemies.findIndex(e => !e.isBoss && e.r === t.r && e.x > t.x - 10 && e.x < t.x + 85);
        if (preyIdx !== -1) {
          state.enemies.splice(preyIdx, 1);
          t.digesting = true;
          t.digestTimer = state.activeBuffs.has('fast_taotie') ? 360 : 720;
          t.scaleX = 1.35; t.scaleY = 1.35;
          spawnFloatingText(t.x, t.y, '⚔️ 饕餮噬魔!', '#00e5ff', 16);
        }
      }
    } else if (t.id === 'shield' && state.activeBuffs.has('lava_shield') && tickCount % 30 === 0) {
      state.enemies.forEach(e => {
        if (e.r === t.r && Math.abs(e.x - t.x) < 75) {
          e.hp -= 32;
          e.hitFlash = 3;
        }
      });
    } else if (t.id === 'crossbow' || t.id === 'frost_mage' || t.id === 'pear_blossom') {
      const hasEnemy = state.enemies.some(e => (t.id === 'pear_blossom' ? Math.abs(e.r - t.r) <= 1 : e.r === t.r) && e.x > t.x);
      if (hasEnemy && t.timer >= 76) {
        t.timer = 0;
        t.shotCount++;
        t.scaleX = 0.82; t.scaleY = 1.2;

        const isFrost = t.id === 'frost_mage';
        const isThunder = !isFrost && state.activeBuffs.has('thunder_bow');
        let dmg = isFrost ? 24 : (isThunder ? 36 : 26);
        if (elem === 'fire') dmg += 8;

        const rowsToShoot = t.id === 'pear_blossom' ? [t.r - 1, t.r, t.r + 1] : [t.r];
        rowsToShoot.forEach(targetRow => {
          if (targetRow >= 0 && targetRow < ROWS) {
            state.bullets.push({
              x: t.x + 22,
              y: BOARD_Y + targetRow * CELL_H + CELL_H / 2 - 4,
              r: targetRow,
              vx: 10, dmg, isFrost, isThunder,
              color: isFrost ? '#00e5ff' : (isThunder ? '#e040fb' : '#ffe599'),
              radius: isFrost ? 6 : 4.5
            });
          }
        });
      }
    }
  });

  // 更新子弹
  for (let i = state.bullets.length - 1; i >= 0; i--) {
    const b = state.bullets[i];
    b.x += b.vx;
    if (b.x > canvas.width + 40) {
      state.bullets.splice(i, 1);
      continue;
    }
    for (let j = state.enemies.length - 1; j >= 0; j--) {
      const e = state.enemies[j];
      if (e.r === b.r && Math.abs(e.x - b.x) < e.radius + b.radius) {
        e.hp -= b.dmg;
        e.hitFlash = 5;

        if (b.isFrost) {
          e.chillTimer = 240;
          if (Math.random() < 0.25) e.freezeTimer = 75;
        }
        if (b.isThunder && state.enemies.length > 1) {
          const near = state.enemies.find(o => o !== e && Math.hypot(o.x - e.x, o.y - e.y) < 170);
          if (near) {
            near.hp -= b.dmg * 0.55;
            near.hitFlash = 5;
            state.lightningArcs.push({ x1: e.x, y1: e.y, x2: near.x, y2: near.y, life: 10 });
          }
        }
        for (let k = 0; k < 5; k++) {
          state.particles.push({
            x: b.x, y: b.y,
            vx: (Math.random() - 0.5) * 4.5, vy: (Math.random() - 0.5) * 4.5,
            size: 2.5, color: b.color || '#ffe599', life: 14
          });
        }
        if (!b.isCrow) {
          state.bullets.splice(i, 1);
          break;
        }
      }
    }
  }

  for (let i = state.lightningArcs.length - 1; i >= 0; i--) {
    state.lightningArcs[i].life--;
    if (state.lightningArcs[i].life <= 0) state.lightningArcs.splice(i, 1);
  }

  // 更新山海魇魔
  for (let i = state.enemies.length - 1; i >= 0; i--) {
    const e = state.enemies[i];
    if (e.hitFlash > 0) e.hitFlash--;
    if (e.chillTimer > 0) e.chillTimer--;
    if (e.freezeTimer > 0) { e.freezeTimer--; continue; }

    const blocker = state.towers.find(t => t.r === e.r && Math.abs(t.x - e.x) < 38);
    if (blocker) {
      e.isAttacking = true;
      if (e.canVault && state.elementalTiles[`${blocker.r}_${blocker.c}`] !== 'earth') {
        e.canVault = false;
        e.x -= 88;
        spawnFloatingText(e.x, e.y - 25, '夜叉鬼步!', '#ea80fc', 14);
      } else {
        const dmgRed = (blocker.id === 'taotie' && blocker.digesting && state.activeBuffs.has('fast_taotie')) ? 0.4 : 1;
        blocker.hp -= 0.75 * dmgRed;
        blocker.hitFlash = 2;
        if (blocker.id === 'shield') {
          e.hp -= state.activeBuffs.has('lava_shield') ? 0.85 : 0.35;
        }
        if (blocker.hp <= 0) {
          const idx = state.towers.indexOf(blocker);
          if (idx !== -1) state.towers.splice(idx, 1);
        }
      }
    } else {
      e.isAttacking = false;
      const spdMult = e.chillTimer > 0 ? 0.5 : 1;
      e.x -= e.spd * spdMult;
    }

    // 突破防线时触发左侧【诛妖巨阙剑匣】一剑斩灭整行！
    if (e.x < BOARD_X - 4) {
      const sword = state.swordArray[e.r];
      if (sword && sword.ready) {
        sword.ready = false;
        triggerRowSwordCleave(e.r, e.y);
      } else {
        e.x = BOARD_X + COLS * CELL_W;
      }
    }

    if (e.hp <= 0) {
      state.energy = Math.min(100, state.energy + 8);
      waveKills++;
      for (let k = 0; k < 12; k++) {
        state.particles.push({
          x: e.x, y: e.y,
          vx: (Math.random() - 0.5) * 5.5, vy: (Math.random() - 0.5) * 5.5,
          size: 3, color: '#90a4ae', life: 20
        });
      }
      state.enemies.splice(i, 1);

      if (!state.bossSpawned && waveKills >= 5 + state.wave * 2) {
        waveKills = 0;
        if (state.wave < state.maxWave) {
          state.wave++;
          if (state.wave % 3 === 0) showRogueModal();
          if (state.wave === state.maxWave) spawnXiangliuBoss();
        }
      }
      updateHUD();
    }
  }

  for (let i = state.particles.length - 1; i >= 0; i--) {
    const p = state.particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
    if (p.life <= 0) state.particles.splice(i, 1);
  }

  if (tickCount % 3 === 0) renderCardPreviews(tickCount);
  updateHUD();
}

// ==============================================================
// 四、 主画布渲染管线
// ==============================================================
function render() {
  ctx.save();
  if (state.screenShake > 0) {
    ctx.translate((Math.random() - 0.5) * state.screenShake, (Math.random() - 0.5) * state.screenShake);
  }
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 1. 绘制左侧【玄机剑冢 · 诛妖巨阙剑匣阵】城垣底座
  const wallGrad = ctx.createLinearGradient(12, 0, BOARD_X - 10, 0);
  wallGrad.addColorStop(0, '#090d11');
  wallGrad.addColorStop(0.5, '#131b22');
  wallGrad.addColorStop(1, '#080b0e');
  ctx.fillStyle = wallGrad;
  ctx.strokeStyle = '#5e471c';
  ctx.lineWidth = 1.5;
  ctx.fillRect(14, BOARD_Y - 32, 128, ROWS * CELL_H + 34);
  ctx.strokeRect(14, BOARD_Y - 32, 128, ROWS * CELL_H + 34);

  // 顶部黑金篆刻铭牌
  ctx.fillStyle = '#18222b';
  ctx.fillRect(15, BOARD_Y - 31, 126, 26);
  ctx.fillStyle = '#ffe599';
  ctx.font = 'bold 12px "STKaiti", "PingFang SC", serif';
  ctx.textAlign = 'center';
  ctx.fillText('⚔️ 剑冢 · 诛妖巨阙阵', 78, BOARD_Y - 14);

  // 绘制每行左侧的悬浮巨阙剑匣
  for (let r = 0; r < ROWS; r++) {
    const cy = BOARD_Y + r * CELL_H + CELL_H / 2;
    HardcoreArt.drawSwordBastion(ctx, 78, cy, tickCount + r * 12, state.swordArray[r].ready);
  }

  // 2. 绘制 5x9 黑曜石浮雕八卦棋盘
  const elemStyles = {
    fire: { color: 'rgba(255, 61, 0, 0.42)', stroke: '#ff6d00', label: '离火 · 攻速+25%' },
    water: { color: 'rgba(0, 229, 255, 0.38)', stroke: '#00e5ff', label: '坎水 · 冷却-30%' },
    earth: { color: 'rgba(201, 160, 80, 0.42)', stroke: '#ffe599', label: '坤土 · 固阵免越' },
    metal: { color: 'rgba(224, 247, 250, 0.35)', stroke: '#e0f7fa', label: '乾金 · 破甲贯杀' }
  };

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const x = BOARD_X + c * CELL_W;
      const y = BOARD_Y + r * CELL_H;
      const isCore = (c === 1 || c === 2);

      // 黑曜石砖块深槽底边
      ctx.fillStyle = '#040608';
      ctx.fillRect(x + 1, y + 1, CELL_W - 2, CELL_H - 2);

      const tileGrad = ctx.createLinearGradient(x, y, x + CELL_W, y + CELL_H);
      if (isCore) {
        tileGrad.addColorStop(0, (r + c) % 2 === 0 ? '#1b2630' : '#162028');
        tileGrad.addColorStop(1, '#0e141a');
      } else {
        tileGrad.addColorStop(0, (r + c) % 2 === 0 ? '#141c23' : '#10171d');
        tileGrad.addColorStop(1, '#090d11');
      }
      ctx.fillStyle = tileGrad;
      ctx.fillRect(x + 2, y + 2, CELL_W - 4, CELL_H - 5);

      // 棱角金属细框线
      ctx.strokeStyle = isCore ? 'rgba(201, 160, 80, 0.35)' : 'rgba(255, 255, 255, 0.04)';
      ctx.lineWidth = 1;
      ctx.strokeRect(x + 2.5, y + 2.5, CELL_W - 5, CELL_H - 6);

      // 五行灵脉法阵
      const key = `${r}_${c}`;
      if (state.elementalTiles[key]) {
        const st = elemStyles[state.elementalTiles[key]];
        const pulse = (Math.sin(tickCount * 0.06) + 1) * 0.5;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        const grad = ctx.createRadialGradient(
          x + CELL_W / 2, y + CELL_H / 2, 4,
          x + CELL_W / 2, y + CELL_H / 2, CELL_W * 0.45
        );
        grad.addColorStop(0, st.color);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.globalAlpha = 0.6 + pulse * 0.4;
        ctx.fillRect(x + 2, y + 2, CELL_W - 4, CELL_H - 5);
        ctx.restore();

        ctx.fillStyle = st.stroke;
        ctx.font = '11px "PingFang SC", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(st.label, x + CELL_W / 2, y + CELL_H - 10);
      }
    }
  }

  // 顶部中枢区标识
  ctx.fillStyle = 'rgba(201, 160, 80, 0.75)';
  ctx.font = 'bold 12px "STKaiti", "PingFang SC", serif';
  ctx.textAlign = 'center';
  ctx.fillText('◆ 墨门中枢防区 (第 2 · 3 列) ◆', BOARD_X + CELL_W * 2, BOARD_Y - 14);

  // 3. 悬停十字激光准星与预览虚影
  if (state.hoverCell.r >= 0 && (state.selectedCard || state.shovelMode)) {
    const { r, c } = state.hoverCell;
    const hx = BOARD_X + c * CELL_W;
    const hy = BOARD_Y + r * CELL_H;
    ctx.save();
    ctx.fillStyle = state.shovelMode ? 'rgba(255, 23, 68, 0.14)' : 'rgba(0, 229, 255, 0.07)';
    ctx.fillRect(BOARD_X, hy, COLS * CELL_W, CELL_H);
    ctx.fillRect(hx, BOARD_Y, CELL_W, ROWS * CELL_H);

    ctx.strokeStyle = state.shovelMode ? '#ff1744' : '#00e5ff';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(hx + 3, hy + 3, CELL_W - 6, CELL_H - 7);

    if (state.selectedCard) {
      ctx.translate(hx + CELL_W / 2, hy + CELL_H / 2);
      ctx.globalAlpha = 0.65;
      HardcoreArt.drawTowerUnit(ctx, state.selectedCard.id, tickCount, {
        armed: true,
        hasThunder: state.activeBuffs.has('thunder_bow'),
        hasLava: state.activeBuffs.has('lava_shield')
      });
    }
    ctx.restore();
  }

  // 4. 绘制场上墨家机关
  const breath = Math.sin(tickCount * 0.08) * 0.02;
  state.towers.forEach(t => {
    ctx.save();
    ctx.translate(t.x, t.y);
    ctx.scale(t.scaleX, t.scaleY + breath);
    if (t.hitFlash > 0) ctx.filter = 'brightness(260%)';

    HardcoreArt.drawTowerUnit(ctx, t.id, tickCount, {
      isOverload: state.overloadTimer > 0,
      armed: t.armed,
      digesting: t.digesting,
      hasThunder: state.activeBuffs.has('thunder_bow'),
      hasLava: state.activeBuffs.has('lava_shield')
    });

    if (t.hp < t.maxHp) {
      drawHealthBar(-24, -42, 48, 5, t.hp / t.maxHp, '#00e5ff');
    }
    ctx.restore();
  });

  // 5. 绘制硬核山海魇魔与相柳 Boss
  state.enemies.forEach(e => {
    HardcoreArt.drawHardcoreMonster(ctx, e, tickCount);
  });

  // 6. 绘制巨阙剑匣触发的【全屏青金剑罡】特效
  state.swordCleaves.forEach(sc => {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const ratio = sc.life / sc.maxLife;
    const h = 46 * ratio;
    const grad = ctx.createLinearGradient(BOARD_X, sc.y - h, BOARD_X, sc.y + h);
    grad.addColorStop(0, 'rgba(0, 229, 255, 0)');
    grad.addColorStop(0.5, `rgba(224, 247, 250, ${ratio})`);
    grad.addColorStop(1, 'rgba(0, 229, 255, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(BOARD_X - 40, sc.y - h, COLS * CELL_W + 80, h * 2);
    ctx.restore();
  });

  // 7. 分形闪电链
  state.lightningArcs.forEach(arc => {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = '#ea80fc';
    ctx.shadowColor = '#d500f9';
    ctx.shadowBlur = 12;
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(arc.x1, arc.y1);
    ctx.lineTo((arc.x1 + arc.x2) / 2 + (Math.random() - 0.5) * 24, (arc.y1 + arc.y2) / 2 + (Math.random() - 0.5) * 24);
    ctx.lineTo(arc.x2, arc.y2);
    ctx.stroke();
    ctx.restore();
  });

  // 8. 破甲重箭与神火飞鸦
  state.bullets.forEach(b => {
    ctx.save();
    ctx.translate(b.x, b.y);
    if (b.isCrow) {
      HardcoreArt.drawTowerUnit(ctx, 'fire_crow', tickCount);
    } else {
      ctx.globalCompositeOperation = 'lighter';
      ctx.shadowColor = b.color;
      ctx.shadowBlur = 10;
      HardcoreArt.drawPolygon(ctx, [
        [16, 0], [4, -5], [7, 0], [-16, -1.5], [-16, 1.5], [7, 0], [4, 5]
      ], b.color, '#ffffff', 1);
    }
    ctx.restore();
  });

  // 9. 天工灵气齿轮
  state.gears.forEach(g => {
    ctx.save();
    ctx.translate(g.x, g.y);
    ctx.rotate(tickCount * 0.04);
    ctx.shadowColor = '#ffe599';
    ctx.shadowBlur = 12;
    HardcoreArt.drawPolygon(ctx, [
      [0, -16], [5, -5], [16, 0], [5, 5], [0, 16], [-5, 5], [-16, 0], [-5, -5]
    ], '#ffe599', '#c9a050', 1.5);
    ctx.restore();
  });

  // 10. 粒子与飘字
  state.particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = Math.min(1, p.life / 18);
    if (p.text) {
      ctx.font = `bold ${p.size}px "PingFang SC", "Microsoft YaHei", sans-serif`;
      ctx.fillStyle = p.color;
      ctx.shadowColor = '#000';
      ctx.shadowBlur = 6;
      ctx.textAlign = 'center';
      ctx.fillText(p.text, p.x, p.y);
    } else {
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.restore();
  });

  ctx.restore();
}

function drawHealthBar(x, y, w, h, ratio, color) {
  ctx.fillStyle = 'rgba(4, 6, 8, 0.9)';
  ctx.strokeStyle = 'rgba(201, 160, 80, 0.55)';
  ctx.lineWidth = 1;
  ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
  ctx.strokeRect(x - 1, y - 1, w + 2, h + 2);
  ctx.fillStyle = color;
  ctx.fillRect(x, y, Math.max(0, w * ratio), h);
}

initElementalTiles();
initCardsUI();
renderCardPreviews(0);
updateHUD();

function gameLoop(now) {
  update(now);
  render();
  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);
</script>
